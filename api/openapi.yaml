      oneOf:
      - properties:
          capability:
            const: iphone.location.current
          arguments:
            $ref: '#/components/schemas/IPhoneEmptyArguments'
      - properties:
          capability:
            const: iphone.contacts.lookup
          arguments:
            $ref: '#/components/schemas/IPhoneContactsLookupArguments'
      - properties:
          capability:
            const: iphone.calendar.events
          arguments:
            $ref: '#/components/schemas/IPhoneCalendarEventsArguments'
      - properties:
          capability:
            const: iphone.photos.pick
          arguments:
            $ref: '#/components/schemas/IPhoneEmptyArguments'
      - properties:
          capability:
            const: iphone.mail.compose
          arguments:
            $ref: '#/components/schemas/IPhoneMailComposeArguments'
      - properties:
          capability:
            const: iphone.sms.compose
          arguments:
            $ref: '#/components/schemas/IPhoneSMSComposeArguments'
      - properties:
          capability:
            const: iphone.calendar.calendars
          arguments:
            $ref: '#/components/schemas/_EmptyCapabilityArguments'
      - properties:
          capability:
            const: iphone.calendar.event.create
          arguments:
            $ref: '#/components/schemas/_CalendarEventCreateArguments'
      - properties:
          capability:
            const: iphone.calendar.event.update
          arguments:
            $ref: '#/components/schemas/_CalendarEventUpdateArguments'
      - properties:
          capability:
            const: iphone.calendar.reminder.create
          arguments:
            $ref: '#/components/schemas/_ReminderCreateArguments'
      - properties:
          capability:
            const: iphone.calendar.reminder.update
          arguments:
            $ref: '#/components/schemas/_ReminderUpdateArguments'
      - properties:
          capability:
            const: iphone.calendar.reminders
          arguments:
            $ref: '#/components/schemas/_CalendarRemindersArguments'
    IPhoneCapabilityGrant:
      type: object
      additionalProperties: false
      required: [schema_version, grant_id, request_id, task_id, agent_id, target_device_id, approval_id, audit_id, capability, action_digest, issued_at, expires_at, use]
      properties:
        schema_version: {const: '0.9', description: Stable capability-envelope schema identifier retained by API release 0.14.2.}
        grant_id: {type: string, minLength: 32, maxLength: 500, readOnly: true}
        request_id: {type: string}
        task_id: {type: string}
        agent_id: {type: string}
        target_device_id: {type: string}
        approval_id: {type: string}
        audit_id: {type: integer, minimum: 1}
        capability: {$ref: '#/components/schemas/IPhoneCapabilityName'}
        action_digest: {$ref: '#/components/schemas/ActionDigest'}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        use: {const: once}
    ActionDigest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    IPhoneEmptyArguments:
      type: object
      additionalProperties: false
    IPhoneContactsLookupArguments:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 200}
    IPhoneCalendarEventsArguments:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time, description: Must be later than `start`.}
    IPhoneMailComposeArguments:
      type: object
      additionalProperties: false
      properties:
        recipients: {type: array, maxItems: 20, items: {type: string, maxLength: 1000}, default: []}
        subject: {type: [string, 'null'], maxLength: 500}
        body: {type: [string, 'null'], maxLength: 10000}
    IPhoneSMSComposeArguments:
      type: object
      additionalProperties: false
      properties:
        recipients: {type: array, maxItems: 20, items: {type: string, maxLength: 1000}, default: []}
        message: {type: [string, 'null'], maxLength: 2000}
    IPhoneCapabilityDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, deny]}
        user_note: {type: [string, 'null'], maxLength: 2000}
    IPhoneCapabilityExecute:
      type: object
      additionalProperties: false
      required: [grant_id, action_digest]
      properties:
        grant_id: {type: string, minLength: 32, maxLength: 500, writeOnly: true}
        action_digest: {$ref: '#/components/schemas/ActionDigest'}
    IPhoneCapabilityConsumeReceipt:
      type: object
      additionalProperties: false
      required: [status, request_id, grant_id, action_digest, consumed_at]
      properties:
        status: {const: consumed}
        request_id: {type: string}
        grant_id: {type: string}
        action_digest: {$ref: '#/components/schemas/ActionDigest'}
        consumed_at: {type: string, format: date-time}
    IPhoneCapabilityResultSubmit:
      type: object
      additionalProperties: false
      required: [grant_id, action_digest, result]
      properties:
        grant_id: {type: string, minLength: 32, maxLength: 500, writeOnly: true}
        action_digest: {$ref: '#/components/schemas/ActionDigest'}
        result: {$ref: '#/components/schemas/IPhoneCapabilityNativeResult'}
    IPhoneCapabilityResultReceipt:
      type: object
      additionalProperties: false
      required: [status, request_id, grant_id]
      properties:
        status: {type: string, enum: [accepted, duplicate]}
        request_id: {type: string}
        grant_id: {type: string}
    IPhoneCapabilityNativeResult:
      type: object
      additionalProperties: false
      description: Strict native result stored server-side; its value is redacted from
        audit, board and WebSocket events.
      required:
      - name
      - status
      properties:
        name:
          $ref: '#/components/schemas/IPhoneCapabilityName'
        status:
          type: string
          enum:
          - completed
          - cancelled
          - denied
          - failed
        value: {}
        reason:
          type: string
          enum:
          - permission_denied
          - unavailable
          - native_error
      oneOf:
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.location.current
          status:
            const: completed
          value:
            $ref: '#/components/schemas/IPhoneLocationValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.contacts.lookup
          status:
            const: completed
          value:
            type: array
            maxItems: 25
            items:
              $ref: '#/components/schemas/IPhoneContactValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.calendar.events
          status:
            const: completed
          value:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/IPhoneCalendarEventValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.photos.pick
          status:
            const: completed
          value:
            $ref: '#/components/schemas/IPhonePhotoValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            type: string
            enum:
            - iphone.mail.compose
            - iphone.sms.compose
          status:
            const: completed
          value:
            $ref: '#/components/schemas/IPhoneComposerValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            type: string
            enum:
            - iphone.photos.pick
            - iphone.mail.compose
            - iphone.sms.compose
          status:
            const: cancelled
          value:
            type: 'null'
      - required:
        - value
        - reason
        properties:
          status:
            const: denied
          value:
            type: 'null'
          reason:
            type: string
            enum:
            - permission_denied
            - unavailable
      - required:
        - value
        - reason
        properties:
          status:
            const: failed
          value:
            type: 'null'
          reason:
            const: native_error
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.calendar.calendars
          status:
            const: completed
          value:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/IPhoneCalendarValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.calendar.event.create
          status:
            const: completed
          value:
            $ref: '#/components/schemas/IPhoneCalendarEventValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.calendar.event.update
          status:
            const: completed
          value:
            $ref: '#/components/schemas/IPhoneCalendarEventValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.calendar.reminder.create
          status:
            const: completed
          value:
            $ref: '#/components/schemas/IPhoneReminderValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.calendar.reminder.update
          status:
            const: completed
          value:
            $ref: '#/components/schemas/IPhoneReminderValue'
      - required:
        - value
        not:
          required:
          - reason
        properties:
          name:
            const: iphone.calendar.reminders
          status:
            const: completed
          value:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/IPhoneReminderValue'
    IPhoneLocationValue:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracy]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        accuracy: {type: [number, 'null']}
    IPhoneContactValue:
      type: object
      additionalProperties: false
      required: [id, name, phoneNumbers, emails]
      properties:
        id: {type: string, minLength: 1, maxLength: 500, pattern: '^\S(?:[\s\S]*\S)?$'}
        name: {type: string, maxLength: 1000}
        phoneNumbers: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 1000, pattern: '^\S(?:[\s\S]*\S)?$'}}
        emails: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 1000, pattern: '^\S(?:[\s\S]*\S)?$'}}
    IPhoneCalendarEventValue:
      type: object
      additionalProperties: false
      required: [id, title, start, end]
      properties:
        id: {type: string, minLength: 1, maxLength: 500, pattern: '^\S(?:[\s\S]*\S)?$'}
        title: {type: string, maxLength: 2000}
        start: {type: string, format: date-time, maxLength: 64}
        end: {type: string, format: date-time, maxLength: 64}
    IPhonePhotoValue:
      type: object
      additionalProperties: false
      required: [uri, width, height]
      properties:
        uri: {type: string, minLength: 1, maxLength: 8000, pattern: '^\S(?:[\s\S]*\S)?$'}
        width: {type: number, exclusiveMinimum: 0}
        height: {type: number, exclusiveMinimum: 0}
    IPhoneComposerValue:
      type: object
      additionalProperties: false
      required: [composed]
      properties:
        composed: {const: true}

    AuditEvent:
      type: object
      description: |
        Public audit projection. Hashes cover the immutable internal serialized
        payload; legacy process-error redaction can therefore make the returned
        payload differ from the material covered by `hash`.
      required: [id, trace_id, event_type, actor_type, actor_id, payload, hash, created_at]
      properties:
        id: {type: integer}
        trace_id:
          type: [string, 'null']
          description: Null only on read-compatible audit rows created before trace metadata existed.
        event_type: {type: string}
        actor_type:
          type: [string, 'null']
          description: Null only on read-compatible audit rows created before actor metadata existed.
        actor_id:
          type: [string, 'null']
          description: Null only on read-compatible audit rows created before actor metadata existed.
        task_id: {type: [string, 'null']}
        payload:
          type: object
          additionalProperties: true
          description: Public payload; legacy process failure text may be redacted.
        prev_hash: {type: [string, 'null']}
        hash:
          type: [string, 'null']
          description: SHA-256 hash of immutable internal event material before public projection; null only for legacy unchained rows.
        created_at: {type: string, format: date-time}
    FeedbackCreate:

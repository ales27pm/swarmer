      tags:
      - Memory
      description: Read proposed multilingual labels in the exact requested scope. Concept
        identity and labels do not grant authority or establish that a claim is true.

x-websocket-endpoints:
  /ws:
    authentication: One-use ticket from POST /ws/ticket in query parameter `ticket`
    events:
      - connected
      - task.updated
      - tool.proposed
      - tool.updated
      - tool.completed
      - tool.failed
      - tool.execution_rejected
      - tool.outcome_uncertain
      - tool.denied
      - approval.requested
      - approval.decided
      - orchestrator.proposed
      - message.created
      - agent.job.queued
      - agent.job.claimed
      - agent.job.completed
      - agent.job.failed
      - iphone.capability.requested
      - iphone.capability.updated
      - goal.updated
      - plan.node.updated
      - goal.result.updated
    iphoneCapabilityPayloads:
      iphone.capability.requested:
        type: object
        additionalProperties: false
        required: [request_id, capability_name, expires_at, preview]
        properties:
          request_id: {type: string}
          capability_name: {$ref: '#/components/schemas/IPhoneCapabilityName'}
          expires_at: {type: string, format: date-time}
          preview:
            type: object
            additionalProperties: false
            required: [arguments_redacted]
            properties:
              arguments_redacted: {type: boolean, const: true}
      iphone.capability.updated:
        type: object
        additionalProperties: false
        required: [request_id]
        properties:
          request_id: {type: string}
    goalPayloads:
      goal.updated: {$ref: '#/components/schemas/GoalUpdatedNotification'}
      plan.node.updated: {$ref: '#/components/schemas/PlanNodeUpdatedNotification'}
      goal.result.updated: {$ref: '#/components/schemas/GoalResultUpdatedNotification'}
    privacy: >-
      iPhone capability events are device-targeted. Requested events expose only
      the request id, capability name, expiry, and an arguments-redacted marker;
      updated events expose only the request id. Goal events are metadata-only
      invalidations and require an authenticated REST refetch; they do not carry
      objectives, expected outputs, worker summaries, or synthesized answers.
      No event carries native results, bearer credentials, grants, or leases.


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-token
      description: Opaque active device token; keep it in secure storage.
    pairingCandidateBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-pairing-candidate
      description: Short-lived candidate returned by `/pairing/complete` before activation.
    operatorToken:
      type: apiKey
      in: header
      name: X-Mongars-Operator-Token
      description: Operator bootstrap secret; accepted only from an actual loopback peer.
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-credential
      description: One-time credential from paired-device registration or private local-operator enrollment.

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string}
    GoalId:
      name: goal_id
      in: path
      required: true
      schema: {type: string}
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string}
    CapabilityRequestId:
      name: request_id
      in: path
      required: true
      schema: {type: string}
    TaskLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    TaskStatusFilter:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/TaskStatus'}
    GoalLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 100}

  responses:
    Unauthorized:
      description: Missing or invalid device bearer token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Caller is not a loopback operator or supplied the wrong operator token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Atomic state transition rejected, including replay or stale state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SecureTransportRequired:
      description: HTTPS is required when the socket peer is not loopback
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HTTPValidationError'}

  schemas:
    MemoryCoverageCounts:
      properties:
        current:
          type: integer

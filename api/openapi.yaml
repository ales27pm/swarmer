          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryIndexCoveragePage'
          headers:
            Cache-Control:
              description: Diagnostics and errors are not cached.
              schema:
                type: string
                const: no-store
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          headers:
            Cache-Control:
              description: Diagnostics and errors are not cached.
              schema:
                type: string
                const: no-store
        '401':
          description: Missing or invalid device bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Cache-Control:
              description: Diagnostics and errors are not cached.
              schema:
                type: string
                const: no-store
        '409':
          description: Atomic state transition rejected, including replay or stale state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Cache-Control:
              description: Diagnostics and errors are not cached.
              schema:
                type: string
                const: no-store
        '426':
          description: HTTPS is required when the socket peer is not loopback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Cache-Control:
              description: Diagnostics and errors are not cached.
              schema:
                type: string
                const: no-store
        '503':
          description: Index unavailable or configured vector dimensions invalid; no
            model probe or implicit repair occurs.
          headers:
            Cache-Control:
              description: Diagnostics and errors are not cached.
              schema:
                type: string
                const: no-store
      description: Read-only paired-owner inspection. Scope, kind and sensitivity filter
        before pagination. Counts describe one read transaction only; cursor pages do
        not form a global snapshot. Stored projections are qualified against current
        source and provider bindings without probing a model. Covered does not mean
        provider available or retrieval relevance validated.

      summary: Read verified private PNG or WAV bytes from an owned goal
      operationId: get_media_goals__goal_id__media__artifact_id__get
      description: |
        Requires the owner device's bearer credential. The artifact must belong
        to this goal and its bytes must match the recorded SHA-256. Responses use
        Cache-Control private, no-store, X-Content-Type-Options nosniff and an inline
        Content-Disposition filename. This route never returns JSON on success.
      parameters:
        - $ref: '#/components/parameters/GoalId'
        - name: artifact_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Verified private artifact bytes
          headers:
            X-Artifact-SHA256:
              description: SHA-256 of the returned bytes
              schema: {type: string, pattern: '^[a-f0-9]{64}$'}
          content:
            image/png:
              schema: {type: string, format: binary}
            audio/wav:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: 'Owned goal, artifact or verified bytes unavailable'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}


openapi: 3.1.0
info:
  title: monGARS Control Plane API
  version: 0.14.2
  description: |
    Authenticated local control-plane API. Pairing-code issuance requires both an
    actual loopback socket peer and the configured operator bootstrap token. A
    pairing completion first returns a short-lived, bootstrap-only candidate.
    Finalization makes that candidate cutover-ready without replacing an existing
    device token; the first authenticated request after durable client storage
    atomically activates the candidate. Device tokens are stored only as SHA-256
    digests. Remote plaintext HTTP is rejected by default; use HTTPS unless the
    socket peer is loopback.

    Chat and planning responses are proposals, not simulated completion claims.
    A task becomes `completed` only after a supported tool returns a verified
    executor result. Writes and process execution require a one-use approval.
    `process.run` is constrained by the Bubblewrap policy and fails closed when
    `/usr/bin/bwrap` is unavailable.

    Distributed jobs use an authoritative SQLite transactional outbox, one
    active remote job per task, server-approved agent cards, deterministic
    skill/capacity scheduling, and expiring hashed-token leases fenced by id and
    generation. Automatic redispatch remains limited to the two read-only
    workspace skills. iPhone capabilities use a separate device approval and a
    short, one-use grant consumed before native execution.

    The notification board defaults to SQLite. Redis Streams is an optional
    application-level event transport selected by server configuration; it is
    never authoritative, workers receive no Redis credentials, and publication
    failures leave the corresponding outbox row pending for recovery. NATS is
    planned, not implemented.
servers:
  - url: https://ubuntu.example
    description: TLS-protected private-network control plane
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Pairing
  - name: Tasks
  - name: Goals
  - name: Chat
  - name: Approvals
  - name: Memory
  - name: Agents
  - name: iPhone Capabilities
  - name: Audit
  - name: Feedback
  - name: Events
  - name: website-projects
    description: Owner-scoped website capture, review, private preview and explicit publication.
paths:
  /health:
    get:
      tags: [System]
      summary: Check control-plane health
      security: []
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}

  /status:
    get:
      tags: [System]
      summary: Read authenticated runtime queue, lease, outbox, and capability counters
      responses:
        '200':
          description: Current local-runtime counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /pairing/code:
    post:
      tags: [Pairing]
      summary: Issue a single active pairing code
      description: |
        Requires the `X-Mongars-Operator-Token` header and a loopback socket
        peer. Proxy headers cannot make a remote peer local. Issuing a code
        invalidates the older code; the six-digit code expires and has a bounded
        attempt budget.
      security:
        - operatorToken: []
      responses:
        '200':
          description: Pairing code issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingCode'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Pairing bootstrap token is not configured}
        '422': {$ref: '#/components/responses/ValidationError'}

  /pairing/complete:
    post:
      tags: [Pairing]
      summary: Exchange a pairing code for a staged device-token candidate
      description: |
        The pairing code is consumed atomically and cannot be reused. The returned
        candidate is short-lived, bound to the requested device and pairing id, and
        can authenticate only bootstrap verification and pairing finalization until
        explicitly finalized. Existing device credentials are not changed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairComplete'}
      responses:
        '200':
          description: Short-lived opaque pairing candidate issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingCandidateResponse'}
        '400': {description: 'Pairing code is invalid, expired, or already consumed'}
        '429': {description: Pairing attempt budget exhausted}
        '426': {description: HTTPS is required outside loopback}
        '422': {$ref: '#/components/responses/ValidationError'}

  /pairing/finalize:
    post:
      tags: [Pairing]
      summary: Finalize a verified pairing candidate for safe client cutover
      description: |
        Requires the exact candidate bearer, pairing id, and device id. The first
        successful call moves the candidate to `ready`; exact retries are
        idempotent. An existing device token remains active until the ready bearer
        makes its first authenticated request after durable client storage. That
        request atomically activates the new token, removes the candidate, replaces
        the old token, and invalidates unused WebSocket tickets for the device.
      security:
        - bearerAuth: []
        - pairingCandidateBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairFinalize'}
      responses:
        '200':
          description: Candidate is ready for cutover, or is already active
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairFinalizeResponse'}
        '401': {description: 'Pairing candidate is missing, invalid, or expired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals:
    get:
      tags: [Goals]
      summary: List authoritative goal runs
      description: Returns public goal projections only; model traces and chain-of-thought are excluded.
      parameters:
        - $ref: '#/components/parameters/GoalLimit'
      responses:
        '200':
          description: Goal runs ordered by most recent authoritative update
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/GoalRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Goals]
      summary: Create a bounded goal run
      description: |
        Creates the authoritative root task and planning-state goal. This does
        not start worker execution; call the explicit start endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalCreateRequest'}
      responses:
        '201':
          description: Goal created in planning state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals/{goal_id}:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags: [Goals]
      summary: Get an authoritative goal, plan graph, and public result
      responses:
        '200':
          description: Current public goal projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals/{goal_id}/memory-usage:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags: [Goals]
      summary: Inspect persisted memory receipts without retrieval or indexing
      description: |
        Passive query-only history, available for terminal and legacy goals.
        Sources are rechecked for current scope and sensitivity on every page.
        A receipt proves retrieval or attachment, not understanding or successful
        use. Missing recorded source versions remain unknown. No raw context,
        vectors or reasoning are exposed. At most 100 items per receipt and
        128 KiB of UTF-8 JSON per page; omitted items are counted explicitly.
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: cursor
          in: query
          required: false
          description: Opaque goal-bound insertion-window cursor; invalid or changed scope returns 400.
          schema: {type: string, maxLength: 512}
      responses:
        '200':
          description: Recorded receipts with a goal-bound continuation cursor
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryUsagePage'}
        '400':
          description: Invalid cursor or changed receipt scope; restart pagination.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503':
          description: Recorded evidence unavailable or invalid; never an empty success.

  /goals/{goal_id}/memory-context:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    post:
      tags: [Goals]
      summary: Retrieve bounded project memory for the current goal
      description: |
        Reads only the goal's linked project and current conversation. May reserve
        one bounded embedding call while preserving a generation credit; repeated
        identical requests reuse the server receipt. Does not create a project or
        plan node. Historical hints cannot override current user answers. The
        context fingerprint must remain current when starting an iPhone plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalMemoryContextRequest'}
      responses:
        '200':
          description: Current project memory, conversation and embedding provenance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalMemoryContextResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals/{goal_id}/start:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    post:
      tags: [Goals]
      summary: Explicitly start or advance a goal
      description: |
        An optional iPhone-local or manual plan remains only a proposal. The
        Ubuntu control plane validates it before dispatch and remains authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalStartRequest'}
      responses:
        '200':
          description: Authoritative goal state after the start attempt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '503': {description: Planner is unavailable and the goal remains recoverable}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals/{goal_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    post:
      tags: [Goals]
      summary: Cancel an active goal without replaying side effects
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalCancelRequest'}
      responses:
        '200':
          description: Authoritative cancelled goal state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals/{goal_id}/replan:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    post:
      tags: [Goals]
      summary: Explicitly request a bounded replan
      description: |
        Replanning is rejected while worker jobs are active and never bypasses
        plan validation, budget limits, the scheduler, or the Permission Gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalReplanRequest'}
      responses:
        '200':
          description: Authoritative replanned goal state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '503': {description: Planner is unavailable and the goal remains recoverable}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals/{goal_id}/nodes:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags: [Goals]
      summary: List the public nodes in a goal plan
      responses:
        '200':
          description: Priority-ordered public plan-node projections
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanNode'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals/{goal_id}/result:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags: [Goals]
      summary: Get the safe aggregated result for a goal
      description: Returns null until an authoritative terminal result has been stored.
      responses:
        '200':
          description: Public result, or null while no result exists
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/GoalResult'
                  - type: 'null'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals/{goal_id}/feedback:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    post:
      tags: [Goals]
      summary: Store bounded feedback for a terminal goal
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalFeedbackRequest'}
      responses:
        '201':
          description: Goal feedback stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalFeedbackRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskLimit'
      responses:
        '200':
          description: Tasks ordered by most recent update
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaskRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Tasks]
      summary: Create a task
      description: Creates durable task state only; it does not report execution completion.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCreate'}
      responses:
        '201':
          description: Task created in `created` state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get task details and execution evidence
      responses:
        '200':
          description: Task with related messages, approvals, and tool calls
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Cancel a non-running task
      description: |
        Cancellation atomically invalidates pending approvals and proposed,
        waiting, or queued tool calls. Running and terminal tasks cannot be
        cancelled through this endpoint.
      responses:
        '200':
          description: Cancelled task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}/plan:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Ask the configured local model to plan a task
      description: |
        Planning is allowed from `created` or `planned`. A `none` tool proposal
        leaves the task planned and records model text as `proposal_only`. A
        supported read tool may execute immediately; writes and processes remain
        gated by a one-use approval.
      responses:
        '200':
          description: Model proposal or resulting tool call
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlanOnlyResult'
                  - $ref: '#/components/schemas/ToolCall'
        '400': {description: Model tool proposal failed executor validation}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {description: Local orchestrator returned no valid proposal}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}/tool-calls:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: List tool calls for a task
      responses:
        '200':
          description: Tool calls in creation order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ToolCall'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Tasks]
      summary: Submit a structured tool proposal
      description: |
        Supported tools are `workspace.list_dir`, `workspace.read_text`,
        `workspace.write_text`, and `process.run`. The gateway validates the
        tool and arguments before persistence. Writes and processes wait for
        approval; process execution also requires Bubblewrap.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolProposal'}
      responses:
        '200':
          description: Executed read call or persisted approval-gated call
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolCall'}
        '400': {description: 'Unsupported tool, invalid arguments, protected path, or unavailable sandbox'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}/dispatch:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Agents]
      summary: Queue a policy-authorized narrow job for a remote agent
      description: |
        Accepts only the seven server-approved workspace, research and code-review
        skills declared by `AgentSkill`. Payloads are normalized by a per-skill
        policy before the durable job is created. No generic shell, arbitrary URL,
        write or push capability is exposed; approval-requiring tools fail closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentJobDispatch'}
      responses:
        '201': {description: Job queued, content: {application/json: {schema: {$ref: '#/components/schemas/AgentJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /chat:
    post:
      tags: [Chat]
      summary: Create or continue a conversation and task
      description: |
        Persists a user message and new task. It does not run a fake workflow or
        mark the task completed; call `/tasks/{task_id}/plan` for a real proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatCreate'}
      responses:
        '201':
          description: Conversation and task created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /conversations:
    get:
      tags: [Chat]
      summary: List conversations
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Conversations ordered by most recent update
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /conversations/{conversation_id}/messages:
    get:
      tags: [Chat]
      summary: List messages in a conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 500}
      responses:
        '200':
          description: Messages in chronological order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /sync/bootstrap:
    get:
      tags: [System]
      summary: Bootstrap the authenticated device replica
      description: |
        Accepts an active device bearer or a staged candidate bearer for pre-cutover
        verification. If the candidate has already been finalized to `ready`, this
        request is the authenticated cutover that atomically activates it.
      security:
        - bearerAuth: []
        - pairingCandidateBearer: []
      responses:
        '200':
          description: Bounded current-state snapshot and audit cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bootstrap'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /sync/mutations:
    post:
      tags: [System]
      summary: Apply one replay-safe mobile mutation idempotently
      description: |
        Applies one explicitly allowlisted ordinary mutation. `Idempotency-Key`
        is bound to the authenticated device, operation, resource and canonical
        payload; an exact retry returns the stored response and a changed retry
        is rejected. Only feedback creation, pinned-memory metadata changes and
        ordinary chat messages with `start_task: false` are accepted. Approval
        decisions, capability grants or execution, native effects and process
        execution cannot be queued through this endpoint.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable caller-generated key reused only for an exact retry.
          schema:
            type: string
            minLength: 20
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SafeMutationRequest'}
      responses:
        '201':
          description: Mutation applied, or the exact stored response returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdempotentMutationReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: 'Bound task, agent, or memory resource does not exist'}
        '409': {description: 'Idempotency key is invalid or already bound to different canonical input'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /approvals:
    get:
      tags: [Approvals]
      summary: List approvals by status
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
            default: pending
      responses:
        '200':
          description: Matching approvals; stale pending entries are expired first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Approval'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /approvals/{approval_id}/decision:
    post:
      tags: [Approvals]
      summary: Decide a pending approval once
      description: |
        `approve` and `allow_once` have identical one-use behavior. There is no
        persistent `allow_rule` decision. Replays, concurrent second decisions,
        and expired approvals return `409` and cannot execute the linked call.
      parameters:
        - name: approval_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecision'}
      responses:
        '200':
          description: Decision recorded, with linked tool result when applicable
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Approval'
                  - $ref: '#/components/schemas/ApprovalToolResult'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /memory:
    get:
      tags: [Memory]
      summary: List memory items
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        '200':
          description: Pinned-first memory list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MemoryItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Memory]
      summary: Store a memory item
      description: |
        When the operator enables English canonical writes, content and any
        summary are translated and reviewed before being stored. Original
        source versions remain in a separate provenance journal, not the
        retrieval index. An uncertain translation is not a successful write.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryCreate'}
      responses:
        '201':
          description: Memory item stored and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryItem'}
        '409': {description: Memory changed during normalization; no stale write committed}
        '503': {description: Local memory normalization unavailable; no write committed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /memory/search:
    post:
      tags: [Memory]
      summary: Search memory with lexical fallback and optional hybrid ranking
      description: |
        SQLite memory remains authoritative. When the configured embedding
        provider and stored embeddings are available, ranking is hybrid;
        otherwise the endpoint falls back to lexical search. Any external
        vector index is rebuildable and cannot destroy or replace memory state.
        In English canonical mode, query normalization is ephemeral and never
        creates a memory. Normalization failures are explicit, not empty results.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemorySearch'}
      responses:
        '200':
          description: Ranked lexical or hybrid matches bounded by the requested limit
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MemorySearchResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '409': {description: Normalization configuration changed during the query}
        '503': {description: Local query normalization unavailable}

  /memory/{memory_id}:
    parameters:
      - name: memory_id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Memory]
      summary: Update memory content, summary, or pin state
      description: English canonical mode validates changed text before an atomic revision update.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryUpdate'}
      responses:
        '200':
          description: Updated and audited memory item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Memory changed during normalization; refresh before retrying}
        '503': {description: Local memory normalization unavailable; no write committed}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Memory]
      summary: Delete a memory item
      responses:
        '204': {description: Memory item deleted and audit event appended}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /catalog/activities:
    get:
      summary: Get Activity Catalog
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityCatalogResponse'
          headers:
            Cache-Control:
              description: Availability is a current snapshot and must not be cached.
              schema:
                type: string
                const: no-store
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/SecureTransportRequired'
        '503':
          description: Packaged activity catalogue unavailable or invalid.
      tags:
      - Agents
      security:
      - bearerAuth: []
  /agents:
    get:
      tags: [Agents]
      summary: List registered agents
      responses:
        '200':
          description: Agent registry
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Agent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}:
    get:
      tags: [Agents]
      summary: Get one registered agent
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/register:
    post:
      tags: [Agents]
      summary: Register an agent
      description: |
        The endpoint must be a credential-free `http` or `https` URL. Skills,
        runtime, protocol and bounded capability metadata are validated against
        server policy; self-declared unknown or privileged skills are rejected.
        The new agent starts `unverified`; its heartbeat credential is returned
        once and is never included in later reads or its public `agent_card`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCreate'}
      responses:
        '201':
          description: Agent registered and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRegistration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/heartbeat:
    post:
      tags: [Agents]
      summary: Authenticate an agent heartbeat
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentHeartbeat'}
      responses:
        '200':
          description: Updated agent record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '401': {description: Missing or invalid agent-specific credential}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/claim:
    post:
      tags: [Agents]
      summary: Atomically claim the highest-priority compatible queued job
      description: |
        Only an `online` agent below `max_concurrency` can claim a compatible
        job. Selection is deterministic by task priority, creation time and id.
        A claim increments its attempt and lease generation and returns an
        opaque token whose digest alone is stored. The current implementation
        accepts `wait_seconds` but returns immediately rather than long-polling.
      security: [{agentBearer: []}]
      parameters: [{$ref: '#/components/parameters/AgentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentJobClaim'}}}
      responses:
        '200':
          description: Claimed job with lease proof, or null when no eligible work exists
          content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ClaimedAgentJob'}, {type: 'null'}]}}}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs:
    get:
      tags: [Agents]
      summary: List jobs owned by the authenticated agent
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Agent jobs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentJob'}}}}}
        '401': {description: Missing or invalid agent-specific credential}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs/{job_id}/heartbeat:
    post:
      tags: [Agents]
      summary: Record liveness for an actively claimed job
      description: Renews an unexpired owned lease; a stale, expired or foreign proof is fenced with 409.
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - {name: job_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentJobHeartbeat'}}}
      responses:
        '200': {description: Running job, content: {application/json: {schema: {$ref: '#/components/schemas/AgentJob'}}}}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs/{job_id}/result:
    post:
      tags: [Agents]
      summary: Submit an idempotent terminal worker result
      description: |
        Transitions the job and parent task atomically. An exact terminal replay
        is acknowledged; a different result or stale lease is rejected with 409.
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - {name: job_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentJobResult'}}}
      responses:
        '200': {description: Terminal job, content: {application/json: {schema: {$ref: '#/components/schemas/AgentJobResultRecord'}}}}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs/{job_id}/capability-requests:
    post:
      tags: [iPhone Capabilities]
      summary: Request a permission-gated iPhone capability for an active job
      description: |
        Requires the agent credential and the exact active lease proof. The
        request is bound to the task, job, lease generation and target device.
        Arguments and grant material are omitted from this worker-facing
        response. Repeating or racing the same job, lease generation,
        capability and canonical arguments returns the original non-terminal
        request; different arguments create a distinct request.
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCapabilityRequest'}
      responses:
        '201':
          description: Capability request created, or its identical non-terminal predecessor returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityRequestPreview'}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs/{job_id}/capability-requests/{request_id}/poll:
    post:
      tags: [iPhone Capabilities]
      summary: Poll a capability result while retaining the active worker lease
      description: |
        The request must belong to the same agent, job and lease generation.
        Workers continue their ordinary job heartbeat while polling. Terminal
        native data appears only in `result`; denied, expired or cancelled
        requests can terminate with a null result.
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/CapabilityRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCapabilityPoll'}
      responses:
        '200':
          description: Authoritative capability state for this lease
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCapabilityPollResult'}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests:
    get:
      tags: [iPhone Capabilities]
      summary: List capability requests targeted to this paired iPhone
      description: Returns only requests whose target device matches the authenticated bearer.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Device-scoped capability request previews
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IPhoneCapabilityRequestPreview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests/{request_id}:
    get:
      tags: [iPhone Capabilities]
      summary: Read an authoritative capability request for this iPhone
      description: |
        Returns validated arguments and the canonical action digest. The opaque
        grant is never recovered by GET; `grant` is null even after approval.
      parameters:
        - $ref: '#/components/parameters/CapabilityRequestId'
      responses:
        '200':
          description: Device-scoped capability request detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityRequestDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests/{request_id}/authorize:
    post:
      tags: [iPhone Capabilities]
      summary: Approve or deny one request on its targeted iPhone
      description: |
        Approval returns the short one-use opaque grant only in this response,
        nested in the request detail; GET always returns `grant: null`. Repeating
        approval before consumption rotates the unconsumed grant and invalidates
        the previous secret, allowing recovery from a lost response. A different
        decision, consumed grant, terminal state, expiry, or lease orphan is
        rejected. Denial returns the detail with `grant: null`.
      parameters:
        - $ref: '#/components/parameters/CapabilityRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IPhoneCapabilityDecision'}
      responses:
        '200':
          description: Decided request, with a one-use grant only when approved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityRequestDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests/{request_id}/execute:
    post:
      tags: [iPhone Capabilities]
      summary: Consume a bound iPhone capability grant before native execution
      description: |
        Atomically consumes the opaque grant after checking device, request,
        capability, approval, action digest, expiry and requesting worker lease.
        A grant cannot be consumed twice.
      parameters:
        - $ref: '#/components/parameters/CapabilityRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IPhoneCapabilityExecute'}
      responses:
        '200':
          description: One-use grant consumption receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityConsumeReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests/{request_id}/result:
    post:
      tags: [iPhone Capabilities]
      summary: Submit a strictly bound native capability result
      description: |
        Requires a previously consumed grant and a matching capability name.
        The first valid result returns `accepted`; a replay with the same
        validated terminal status and value returns `duplicate`; a different
        terminal result is rejected.
        The validated result is stored in the protected SQLite state for the
        worker poll. Audit contains only correlation, status, and an explicit
        redaction marker; the board contains only correlation and status; the
        corresponding WebSocket update contains only `request_id`. None exposes
        the native value.
      parameters:
        - $ref: '#/components/parameters/CapabilityRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IPhoneCapabilityResultSubmit'}
      responses:
        '200':
          description: Accepted or duplicate result receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityResultReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /audit:
    get:
      tags: [Audit]
      summary: Read hash-chained audit events
      description: |
        Returns the authenticated public projection of the append-only audit log.
        Legacy process failure text is redacted at read time. The `prev_hash` and
        `hash` values attest the immutable internal row, so a projected payload
        containing a redaction cannot be re-hashed directly by an API client.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: after_id
          in: query
          description: Later events ascending; omission returns newest first.
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Audit events including previous and current hashes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /feedback:
    post:
      tags: [Feedback]
      summary: Store task or agent feedback
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackCreate'}
      responses:
        '201':
          description: Feedback event stored and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Referenced task or agent does not exist}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /feedback/correction:
    post:
      tags: [Feedback]
      summary: Store a reviewed correction for a task
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackCorrection'}}}
      responses:
        '201':
          description: Redacted correction stored
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /feedback/dataset/export:
    get:
      tags: [Feedback]
      summary: Export reviewed training and evaluation examples as JSONL
      parameters:
        - name: dataset
          in: query
          schema:
            type: string
            enum: [task, planner, evaluator, synthesis, routing]
            default: task
        - name: minimum_score
          in: query
          schema: {type: number, minimum: 0, maximum: 5, default: 0}
        - name: successful_only
          in: query
          schema: {type: boolean, default: false}
        - name: reviewed_only
          in: query
          schema: {type: boolean, default: false}
        - name: planner_source
          in: query
          schema:
            anyOf:
              - type: string
                enum: [iphone_local, ubuntu_local, manual, test]
              - type: 'null'
      responses:
        '200': {description: Redacted JSONL envelope, content: {application/json: {schema: {$ref: '#/components/schemas/DatasetExport'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /ws/ticket:
    post:
      tags: [Events]
      summary: Mint a one-use WebSocket ticket
      description: |
        Returns a 30-second ticket bound to the authenticated device. Pass only
        that one-use ticket to `wss://<host>/ws?ticket=<ticket>`; the long-lived
        bearer token is never put in a WebSocket URL.
      responses:
        '200':
          description: One-use WebSocket ticket
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSocketTicket'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /goals/{goal_id}/nodes/{node_id}/code-proposal:
    get:
      summary: Get Code Proposal
      parameters:
      - name: goal_id
        in: path
        required: true
        schema:
          type: string
          title: Goal Id
      - name: node_id
        in: path
        required: true
        schema:
          type: string
          title: Node Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeProposalPreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/SecureTransportRequired'
      security:
      - bearerAuth: []
  /goals/{goal_id}/nodes/{node_id}/code-proposal/apply:
    post:
      summary: Apply Code Proposal
      parameters:
      - name: goal_id
        in: path
        required: true
        schema:
          type: string
          title: Goal Id
      - name: node_id
        in: path
        required: true
        schema:
          type: string
          title: Node Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeProposalApplyRequest'
      responses:
        '200':

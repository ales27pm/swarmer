  /agents/{agent_id}/jobs/{job_id}/media:
    post:
      tags: [Agents]
      summary: Upload a private generated artifact under the current worker lease
      operationId: upload_media_agents__agent_id__jobs__job_id__media_post
      description: |
        Streams raw PNG or PCM16 mono 24 kHz WAV bytes, never multipart or JSON,
        with a maximum size of 8 MiB. The worker credential must match the agent
        and the claim token, lease id and generation must identify its current
        active job. The server verifies the digest, format and job requirements,
        stores the private artifact, and returns its reference. This upload does
        not complete the job; the worker must submit its terminal result separately.
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/JobId'
        - name: x-claim-token
          in: header
          required: true
          schema: {type: string, minLength: 20, maxLength: 500}
        - name: x-lease-id
          in: header
          required: true
          schema: {type: string, minLength: 10, maxLength: 200}
        - name: x-lease-generation
          in: header
          required: true
          schema: {type: integer, minimum: 1}
        - name: x-artifact-sha256
          in: header
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, format: binary}
          audio/wav:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Server-verified artifact reference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaArtifact'}
        '401': {description: Missing or invalid agent-specific credential}
        '408': {description: Upload exceeded the server time limit}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: Invalid Content-Length or media size limit exceeded}
        '415': {description: Content-Type must be image/png or audio/wav}
        '422': {$ref: '#/components/responses/ValidationError'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '507': {description: Private media storage limit reached}

  /goals/{goal_id}/media:

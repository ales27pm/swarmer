openapi: 3.1.0
info:
  title: monGARS Control Plane API
  version: 0.11.0
  description: |
    Authenticated local control-plane API. Pairing-code issuance requires both an
    actual loopback socket peer and the configured operator bootstrap token. A
    pairing completion first returns a short-lived, bootstrap-only candidate.
    Finalization makes that candidate cutover-ready without replacing an existing
    device token; the first authenticated request after durable client storage
    atomically activates the candidate. Device tokens are stored only as SHA-256
    digests. Remote plaintext HTTP is rejected by default; use HTTPS unless the
    socket peer is loopback.

    Chat and planning responses are proposals, not simulated completion claims.
    A task becomes `completed` only after a supported tool returns a verified
    executor result. Writes and process execution require a one-use approval.
    `process.run` is constrained by the Bubblewrap policy and fails closed when
    `/usr/bin/bwrap` is unavailable.

    Distributed jobs use an authoritative SQLite transactional outbox, one
    active remote job per task, server-approved agent cards, deterministic
    skill/capacity scheduling, and expiring hashed-token leases fenced by id and
    generation. Automatic redispatch remains limited to the two read-only
    workspace skills. iPhone capabilities use a separate device approval and a
    short, one-use grant consumed before native execution.

    The notification board defaults to SQLite. Redis Streams is an optional
    application-level event transport selected by server configuration; it is
    never authoritative, workers receive no Redis credentials, and publication
    failures leave the corresponding outbox row pending for recovery. NATS is
    planned, not implemented.
servers:
  - url: https://ubuntu.example
    description: TLS-protected private-network control plane
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Pairing
  - name: Tasks
  - name: Chat
  - name: Approvals
  - name: Memory
  - name: Agents
  - name: iPhone Capabilities
  - name: Audit
  - name: Feedback
  - name: Events
paths:
  /health:
    get:
      tags: [System]
      summary: Check control-plane health
      security: []
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}

  /status:
    get:
      tags: [System]
      summary: Read authenticated runtime queue, lease, outbox, and capability counters
      responses:
        '200':
          description: Current local-runtime counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /pairing/code:
    post:
      tags: [Pairing]
      summary: Issue a single active pairing code
      description: |
        Requires the `X-Mongars-Operator-Token` header and a loopback socket
        peer. Proxy headers cannot make a remote peer local. Issuing a code
        invalidates the older code; the six-digit code expires and has a bounded
        attempt budget.
      security:
        - operatorToken: []
      responses:
        '200':
          description: Pairing code issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingCode'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Pairing bootstrap token is not configured}
        '422': {$ref: '#/components/responses/ValidationError'}

  /pairing/complete:
    post:
      tags: [Pairing]
      summary: Exchange a pairing code for a staged device-token candidate
      description: |
        The pairing code is consumed atomically and cannot be reused. The returned
        candidate is short-lived, bound to the requested device and pairing id, and
        can authenticate only bootstrap verification and pairing finalization until
        explicitly finalized. Existing device credentials are not changed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairComplete'}
      responses:
        '200':
          description: Short-lived opaque pairing candidate issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingCandidateResponse'}
        '400': {description: 'Pairing code is invalid, expired, or already consumed'}
        '429': {description: Pairing attempt budget exhausted}
        '426': {description: HTTPS is required outside loopback}
        '422': {$ref: '#/components/responses/ValidationError'}

  /pairing/finalize:
    post:
      tags: [Pairing]
      summary: Finalize a verified pairing candidate for safe client cutover
      description: |
        Requires the exact candidate bearer, pairing id, and device id. The first
        successful call moves the candidate to `ready`; exact retries are
        idempotent. An existing device token remains active until the ready bearer
        makes its first authenticated request after durable client storage. That
        request atomically activates the new token, removes the candidate, replaces
        the old token, and invalidates unused WebSocket tickets for the device.
      security:
        - bearerAuth: []
        - pairingCandidateBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairFinalize'}
      responses:
        '200':
          description: Candidate is ready for cutover, or is already active
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairFinalizeResponse'}
        '401': {description: 'Pairing candidate is missing, invalid, or expired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskLimit'
      responses:
        '200':
          description: Tasks ordered by most recent update
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaskRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Tasks]
      summary: Create a task
      description: Creates durable task state only; it does not report execution completion.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCreate'}
      responses:
        '201':
          description: Task created in `created` state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get task details and execution evidence
      responses:
        '200':
          description: Task with related messages, approvals, and tool calls
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Cancel a non-running task
      description: |
        Cancellation atomically invalidates pending approvals and proposed,
        waiting, or queued tool calls. Running and terminal tasks cannot be
        cancelled through this endpoint.
      responses:
        '200':
          description: Cancelled task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}/plan:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      summary: Ask the configured local model to plan a task
      description: |
        Planning is allowed from `created` or `planned`. A `none` tool proposal
        leaves the task planned and records model text as `proposal_only`. A
        supported read tool may execute immediately; writes and processes remain
        gated by a one-use approval.
      responses:
        '200':
          description: Model proposal or resulting tool call
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlanOnlyResult'
                  - $ref: '#/components/schemas/ToolCall'
        '400': {description: Model tool proposal failed executor validation}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {description: Local orchestrator returned no valid proposal}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}/tool-calls:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: List tool calls for a task
      responses:
        '200':
          description: Tool calls in creation order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ToolCall'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Tasks]
      summary: Submit a structured tool proposal
      description: |
        Supported tools are `workspace.list_dir`, `workspace.read_text`,
        `workspace.write_text`, and `process.run`. The gateway validates the
        tool and arguments before persistence. Writes and processes wait for
        approval; process execution also requires Bubblewrap.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolProposal'}
      responses:
        '200':
          description: Executed read call or persisted approval-gated call
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolCall'}
        '400': {description: 'Unsupported tool, invalid arguments, protected path, or unavailable sandbox'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /tasks/{task_id}/dispatch:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Agents]
      summary: Queue a policy-authorized narrow job for a remote agent
      description: |
        Accepts only the seven server-approved workspace, research and code-review
        skills declared by `AgentSkill`. Payloads are normalized by a per-skill
        policy before the durable job is created. No generic shell, arbitrary URL,
        write or push capability is exposed; approval-requiring tools fail closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentJobDispatch'}
      responses:
        '201': {description: Job queued, content: {application/json: {schema: {$ref: '#/components/schemas/AgentJob'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /chat:
    post:
      tags: [Chat]
      summary: Create or continue a conversation and task
      description: |
        Persists a user message and new task. It does not run a fake workflow or
        mark the task completed; call `/tasks/{task_id}/plan` for a real proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatCreate'}
      responses:
        '201':
          description: Conversation and task created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /conversations:
    get:
      tags: [Chat]
      summary: List conversations
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Conversations ordered by most recent update
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /conversations/{conversation_id}/messages:
    get:
      tags: [Chat]
      summary: List messages in a conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 500}
      responses:
        '200':
          description: Messages in chronological order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Message'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /sync/bootstrap:
    get:
      tags: [System]
      summary: Bootstrap the authenticated device replica
      description: |
        Accepts an active device bearer or a staged candidate bearer for pre-cutover
        verification. If the candidate has already been finalized to `ready`, this
        request is the authenticated cutover that atomically activates it.
      security:
        - bearerAuth: []
        - pairingCandidateBearer: []
      responses:
        '200':
          description: Bounded current-state snapshot and audit cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bootstrap'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /sync/mutations:
    post:
      tags: [System]
      summary: Apply one replay-safe mobile mutation idempotently
      description: |
        Applies one explicitly allowlisted ordinary mutation. `Idempotency-Key`
        is bound to the authenticated device, operation, resource and canonical
        payload; an exact retry returns the stored response and a changed retry
        is rejected. Only feedback creation, pinned-memory metadata changes and
        ordinary chat messages with `start_task: false` are accepted. Approval
        decisions, capability grants or execution, native effects and process
        execution cannot be queued through this endpoint.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable caller-generated key reused only for an exact retry.
          schema:
            type: string
            minLength: 20
            maxLength: 200
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SafeMutationRequest'}
      responses:
        '201':
          description: Mutation applied, or the exact stored response returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdempotentMutationReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: 'Bound task, agent, or memory resource does not exist'}
        '409': {description: 'Idempotency key is invalid or already bound to different canonical input'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /approvals:
    get:
      tags: [Approvals]
      summary: List approvals by status
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
            default: pending
      responses:
        '200':
          description: Matching approvals; stale pending entries are expired first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Approval'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /approvals/{approval_id}/decision:
    post:
      tags: [Approvals]
      summary: Decide a pending approval once
      description: |
        `approve` and `allow_once` have identical one-use behavior. There is no
        persistent `allow_rule` decision. Replays, concurrent second decisions,
        and expired approvals return `409` and cannot execute the linked call.
      parameters:
        - name: approval_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecision'}
      responses:
        '200':
          description: Decision recorded, with linked tool result when applicable
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Approval'
                  - $ref: '#/components/schemas/ApprovalToolResult'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /memory:
    get:
      tags: [Memory]
      summary: List memory items
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        '200':
          description: Pinned-first memory list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MemoryItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Memory]
      summary: Store a memory item
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryCreate'}
      responses:
        '201':
          description: Memory item stored and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /memory/search:
    post:
      tags: [Memory]
      summary: Search memory with lexical fallback and optional hybrid ranking
      description: |
        SQLite memory remains authoritative. When the configured embedding
        provider and stored embeddings are available, ranking is hybrid;
        otherwise the endpoint falls back to lexical search. Any external
        vector index is rebuildable and cannot destroy or replace memory state.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemorySearch'}
      responses:
        '200':
          description: Up to 50 ranked lexical or hybrid matches
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MemorySearchResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /memory/{memory_id}:
    parameters:
      - name: memory_id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [Memory]
      summary: Update memory content, summary, or pin state
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemoryUpdate'}
      responses:
        '200':
          description: Updated and audited memory item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Memory]
      summary: Delete a memory item
      responses:
        '204': {description: Memory item deleted and audit event appended}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents:
    get:
      tags: [Agents]
      summary: List registered agents
      responses:
        '200':
          description: Agent registry
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Agent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}:
    get:
      tags: [Agents]
      summary: Get one registered agent
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Agent record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/register:
    post:
      tags: [Agents]
      summary: Register an agent
      description: |
        The endpoint must be a credential-free `http` or `https` URL. Skills,
        runtime, protocol and bounded capability metadata are validated against
        server policy; self-declared unknown or privileged skills are rejected.
        The new agent starts `unverified`; its heartbeat credential is returned
        once and is never included in later reads or its public `agent_card`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCreate'}
      responses:
        '201':
          description: Agent registered and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRegistration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/heartbeat:
    post:
      tags: [Agents]
      summary: Authenticate an agent heartbeat
      security:
        - agentBearer: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentHeartbeat'}
      responses:
        '200':
          description: Updated agent record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '401': {description: Missing or invalid agent-specific credential}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/claim:
    post:
      tags: [Agents]
      summary: Atomically claim the highest-priority compatible queued job
      description: |
        Only an `online` agent below `max_concurrency` can claim a compatible
        job. Selection is deterministic by task priority, creation time and id.
        A claim increments its attempt and lease generation and returns an
        opaque token whose digest alone is stored. The current implementation
        accepts `wait_seconds` but returns immediately rather than long-polling.
      security: [{agentBearer: []}]
      parameters: [{$ref: '#/components/parameters/AgentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentJobClaim'}}}
      responses:
        '200':
          description: Claimed job with lease proof, or null when no eligible work exists
          content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ClaimedAgentJob'}, {type: 'null'}]}}}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs:
    get:
      tags: [Agents]
      summary: List jobs owned by the authenticated agent
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Agent jobs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentJob'}}}}}
        '401': {description: Missing or invalid agent-specific credential}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs/{job_id}/heartbeat:
    post:
      tags: [Agents]
      summary: Record liveness for an actively claimed job
      description: Renews an unexpired owned lease; a stale, expired or foreign proof is fenced with 409.
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - {name: job_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentJobHeartbeat'}}}
      responses:
        '200': {description: Running job, content: {application/json: {schema: {$ref: '#/components/schemas/AgentJob'}}}}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs/{job_id}/result:
    post:
      tags: [Agents]
      summary: Submit an idempotent terminal worker result
      description: |
        Transitions the job and parent task atomically. An exact terminal replay
        is acknowledged; a different result or stale lease is rejected with 409.
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - {name: job_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentJobResult'}}}
      responses:
        '200': {description: Terminal job, content: {application/json: {schema: {$ref: '#/components/schemas/AgentJobResultRecord'}}}}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs/{job_id}/capability-requests:
    post:
      tags: [iPhone Capabilities]
      summary: Request a permission-gated iPhone capability for an active job
      description: |
        Requires the agent credential and the exact active lease proof. The
        request is bound to the task, job, lease generation and target device.
        Arguments and grant material are omitted from this worker-facing
        response. Repeating or racing the same job, lease generation,
        capability and canonical arguments returns the original non-terminal
        request; different arguments create a distinct request.
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCapabilityRequest'}
      responses:
        '201':
          description: Capability request created, or its identical non-terminal predecessor returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityRequestPreview'}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /agents/{agent_id}/jobs/{job_id}/capability-requests/{request_id}/poll:
    post:
      tags: [iPhone Capabilities]
      summary: Poll a capability result while retaining the active worker lease
      description: |
        The request must belong to the same agent, job and lease generation.
        Workers continue their ordinary job heartbeat while polling. Terminal
        native data appears only in `result`; denied, expired or cancelled
        requests can terminate with a null result.
      security: [{agentBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/CapabilityRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCapabilityPoll'}
      responses:
        '200':
          description: Authoritative capability state for this lease
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCapabilityPollResult'}
        '401': {description: Missing or invalid agent-specific credential}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests:
    get:
      tags: [iPhone Capabilities]
      summary: List capability requests targeted to this paired iPhone
      description: Returns only requests whose target device matches the authenticated bearer.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Device-scoped capability request previews
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IPhoneCapabilityRequestPreview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests/{request_id}:
    get:
      tags: [iPhone Capabilities]
      summary: Read an authoritative capability request for this iPhone
      description: |
        Returns validated arguments and the canonical action digest. The opaque
        grant is never recovered by GET; `grant` is null even after approval.
      parameters:
        - $ref: '#/components/parameters/CapabilityRequestId'
      responses:
        '200':
          description: Device-scoped capability request detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityRequestDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests/{request_id}/authorize:
    post:
      tags: [iPhone Capabilities]
      summary: Approve or deny one request on its targeted iPhone
      description: |
        Approval returns the short one-use opaque grant only in this response,
        nested in the request detail; GET always returns `grant: null`. Repeating
        approval before consumption rotates the unconsumed grant and invalidates
        the previous secret, allowing recovery from a lost response. A different
        decision, consumed grant, terminal state, expiry, or lease orphan is
        rejected. Denial returns the detail with `grant: null`.
      parameters:
        - $ref: '#/components/parameters/CapabilityRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IPhoneCapabilityDecision'}
      responses:
        '200':
          description: Decided request, with a one-use grant only when approved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityRequestDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests/{request_id}/execute:
    post:
      tags: [iPhone Capabilities]
      summary: Consume a bound iPhone capability grant before native execution
      description: |
        Atomically consumes the opaque grant after checking device, request,
        capability, approval, action digest, expiry and requesting worker lease.
        A grant cannot be consumed twice.
      parameters:
        - $ref: '#/components/parameters/CapabilityRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IPhoneCapabilityExecute'}
      responses:
        '200':
          description: One-use grant consumption receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityConsumeReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /iphone/capabilities/requests/{request_id}/result:
    post:
      tags: [iPhone Capabilities]
      summary: Submit a strictly bound native capability result
      description: |
        Requires a previously consumed grant and a matching capability name.
        The first valid result returns `accepted`; a replay with the same
        validated terminal status and value returns `duplicate`; a different
        terminal result is rejected.
        The validated result is stored in the protected SQLite state for the
        worker poll. Audit contains only correlation, status, and an explicit
        redaction marker; the board contains only correlation and status; the
        corresponding WebSocket update contains only `request_id`. None exposes
        the native value.
      parameters:
        - $ref: '#/components/parameters/CapabilityRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IPhoneCapabilityResultSubmit'}
      responses:
        '200':
          description: Accepted or duplicate result receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPhoneCapabilityResultReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /audit:
    get:
      tags: [Audit]
      summary: Read hash-chained audit events
      description: |
        Returns the authenticated public projection of the append-only audit log.
        Legacy process failure text is redacted at read time. The `prev_hash` and
        `hash` values attest the immutable internal row, so a projected payload
        containing a redaction cannot be re-hashed directly by an API client.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: after_id
          in: query
          description: Later events ascending; omission returns newest first.
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Audit events including previous and current hashes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /feedback:
    post:
      tags: [Feedback]
      summary: Store task or agent feedback
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackCreate'}
      responses:
        '201':
          description: Feedback event stored and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Referenced task or agent does not exist}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /feedback/correction:
    post:
      tags: [Feedback]
      summary: Store a reviewed correction for a task
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FeedbackCorrection'}}}
      responses:
        '201':
          description: Redacted correction stored
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /feedback/dataset/export:
    get:
      tags: [Feedback]
      summary: Export reviewed training and evaluation examples as JSONL
      responses:
        '200': {description: Redacted JSONL envelope, content: {application/json: {schema: {$ref: '#/components/schemas/DatasetExport'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /ws/ticket:
    post:
      tags: [Events]
      summary: Mint a one-use WebSocket ticket
      description: |
        Returns a 30-second ticket bound to the authenticated device. Pass only
        that one-use ticket to `wss://<host>/ws?ticket=<ticket>`; the long-lived
        bearer token is never put in a WebSocket URL.
      responses:
        '200':
          description: One-use WebSocket ticket
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSocketTicket'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '426': {$ref: '#/components/responses/SecureTransportRequired'}
        '422': {$ref: '#/components/responses/ValidationError'}

x-websocket-endpoints:
  /ws:
    authentication: One-use ticket from POST /ws/ticket in query parameter `ticket`
    events:
      - connected
      - task.updated
      - tool.proposed
      - tool.updated
      - tool.completed
      - tool.failed
      - tool.execution_rejected
      - tool.outcome_uncertain
      - tool.denied
      - approval.requested
      - approval.decided
      - orchestrator.proposed
      - message.created
      - agent.job.queued
      - agent.job.claimed
      - agent.job.completed
      - agent.job.failed
      - iphone.capability.requested
      - iphone.capability.updated
    iphoneCapabilityPayloads:
      iphone.capability.requested:
        type: object
        additionalProperties: false
        required: [request_id, capability_name, expires_at, preview]
        properties:
          request_id: {type: string}
          capability_name: {$ref: '#/components/schemas/IPhoneCapabilityName'}
          expires_at: {type: string, format: date-time}
          preview:
            type: object
            additionalProperties: false
            required: [arguments_redacted]
            properties:
              arguments_redacted: {type: boolean, const: true}
      iphone.capability.updated:
        type: object
        additionalProperties: false
        required: [request_id]
        properties:
          request_id: {type: string}
    privacy: >-
      iPhone capability events are device-targeted. Requested events expose only
      the request id, capability name, expiry, and an arguments-redacted marker;
      updated events expose only the request id. Neither event carries arguments,
      native results, bearer credentials, or grants.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-token
      description: Opaque active device token; keep it in secure storage.
    pairingCandidateBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-pairing-candidate
      description: Short-lived candidate returned by `/pairing/complete` before activation.
    operatorToken:
      type: apiKey
      in: header
      name: X-Mongars-Operator-Token
      description: Operator bootstrap secret; accepted only from an actual loopback peer.
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-credential
      description: One-time credential returned when an authenticated device registers an agent.

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string}
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string}
    CapabilityRequestId:
      name: request_id
      in: path
      required: true
      schema: {type: string}
    TaskLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    TaskStatusFilter:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/TaskStatus'}

  responses:
    Unauthorized:
      description: Missing or invalid device bearer token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Caller is not a loopback operator or supplied the wrong operator token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Atomic state transition rejected, including replay or stale state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SecureTransportRequired:
      description: HTTPS is required when the socket peer is not loopback
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/HTTPValidationError'}

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: {}
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc: {type: array, items: {}}
              msg: {type: string}
              type: {type: string}
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status: {const: ok}
        service: {const: mongars-control-plane}
        version: {type: string}
    RuntimeStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - instance_id
        - message_board_backend
        - message_board_health
        - last_successful_publication
        - redis_reconnect_count
        - redis_last_error_category
        - outbox_pending
        - outbox_publishing
        - outbox_failed
        - outbox_duplicate_publications
        - outbox_claim_expirations
        - outbox_publish_latency_ms_count
        - outbox_publish_latency_ms_total
        - outbox_publish_latency_ms_max
        - queued_jobs
        - leased_jobs
        - dead_letter_jobs
        - quarantined_jobs
        - expired_leases
        - retries
        - dead_letter_events
        - active_agents
        - offline_agents
        - maintenance_lease_owner
        - maintenance_lease_renewal_failures
        - pending_capability_requests
        - vector_backend
        - vector_generation_age_seconds
      properties:
        status: {type: string, const: ok}
        version: {const: 0.11.0}
        instance_id:
          type: string
          pattern: '^cp_[0-9a-f]{32}$'
          description: Random boot-scoped control-plane instance identity.
        message_board_backend: {type: string, enum: [sqlite, redis]}
        message_board_health: {type: string, enum: [connected, degraded]}
        last_successful_publication: {type: [string, 'null'], format: date-time}
        redis_reconnect_count:
          type: integer
          minimum: 0
          description: Process-local Redis reconnect attempts; zero in SQLite mode.
        redis_last_error_category:
          type: [string, 'null']
          enum: [timeout, connection, authentication, tls, publication, dedupe_conflict, protocol, null]
          description: Safe error class/category only; never a Redis URL, credential, or raw message.
        outbox_pending: {type: integer, minimum: 0}
        outbox_publishing: {type: integer, minimum: 0}
        outbox_failed: {type: integer, minimum: 0}
        outbox_duplicate_publications: {type: integer, minimum: 0}
        outbox_claim_expirations: {type: integer, minimum: 0}
        outbox_publish_latency_ms_count: {type: integer, minimum: 0}
        outbox_publish_latency_ms_total: {type: integer, minimum: 0}
        outbox_publish_latency_ms_max: {type: integer, minimum: 0}
        queued_jobs: {type: integer, minimum: 0}
        leased_jobs: {type: integer, minimum: 0}
        dead_letter_jobs: {type: integer, minimum: 0}
        quarantined_jobs: {type: integer, minimum: 0}
        expired_leases: {type: integer, minimum: 0}
        retries: {type: integer, minimum: 0}
        dead_letter_events: {type: integer, minimum: 0}
        active_agents: {type: integer, minimum: 0}
        offline_agents: {type: integer, minimum: 0}
        maintenance_lease_owner:
          type: object
          description: Named singleton lease to boot-scoped owner identity mapping.
          additionalProperties: {type: string}
        maintenance_lease_renewal_failures: {type: integer, minimum: 0}
        pending_capability_requests: {type: integer, minimum: 0}
        vector_backend: {type: string, enum: [sqlite, faiss]}
        vector_generation_age_seconds:
          type: [number, 'null']
          minimum: 0
          description: Age of the active rebuildable FAISS projection generation, if configured.
    PairingCode:
      type: object
      required: [code, expires_in_seconds]
      properties:
        code: {type: string, pattern: '^\d{6}$'}
        expires_in_seconds: {type: integer, minimum: 60, maximum: 900}
    PairComplete:
      type: object
      additionalProperties: false
      required: [code, device_id]
      properties:
        code: {type: string, pattern: '^\d{6}$'}
        device_id: {type: string, minLength: 3, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$'}
        name: {type: string, minLength: 1, maxLength: 200, default: iPhone}
    PairingCandidateResponse:
      type: object
      required: [pairing_id, candidate_token, device_id, expires_in_seconds]
      properties:
        pairing_id: {type: string, pattern: '^pair_[0-9a-f]{32}$'}
        candidate_token: {type: string, minLength: 32, readOnly: true}
        device_id: {type: string}
        expires_in_seconds: {type: integer, minimum: 30, maximum: 300}
    PairFinalize:
      type: object
      additionalProperties: false
      required: [pairing_id, device_id]
      properties:
        pairing_id: {type: string, pattern: '^pair_[0-9a-f]{32}$'}
        device_id: {type: string, minLength: 3, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$'}
    PairFinalizeResponse:
      type: object
      required: [status, device_id, pairing_id, already_finalized]
      properties:
        status: {type: string, enum: [ready, active]}
        device_id: {type: string}
        pairing_id: {type: string}
        already_finalized: {type: boolean}

    TaskMode:
      type: string
      enum: [normal, commandant, review, autonome]
    TaskStatus:
      type: string
      enum: [created, planned, waiting_permission, queued, running, blocked, completed, failed, cancelled]
    TaskCreate:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {type: string, minLength: 1, maxLength: 32000}
        mode: {$ref: '#/components/schemas/TaskMode', default: normal}
        conversation_id: {type: [string, 'null']}
        priority: {type: integer, minimum: -100, maximum: 100, default: 0}
    TaskRecord:
      type: object
      required: [id, title, input, mode, source, conversation_id, status, created_at, updated_at]
      properties:
        id: {type: string}
        title: {type: string}
        input: {type: string}
        mode: {$ref: '#/components/schemas/TaskMode'}
        source: {type: string}
        conversation_id: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/TaskStatus'}
        priority: {type: integer, default: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        error_json:
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: 'null'}
    TaskDetail:
      type: object
      required: [task, messages, approvals, tool_calls]
      properties:
        task: {$ref: '#/components/schemas/TaskRecord'}
        messages: {type: array, items: {$ref: '#/components/schemas/Message'}}
        approvals: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        tool_calls: {type: array, items: {$ref: '#/components/schemas/ToolCall'}}

    ChatCreate:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 32000}
        conversation_id: {type: [string, 'null']}
        mode: {$ref: '#/components/schemas/TaskMode', default: normal}
        start_task:
          type: boolean
          default: false
          description: Create a task only after an explicit user action; otherwise remain conversational.
    ChatResult:
      type: object
      required: [conversation_id, task]
      properties:
        conversation_id: {type: string}
        task:
          oneOf:
            - {$ref: '#/components/schemas/TaskRecord'}
            - {type: 'null'}
        message:
          oneOf:
            - {$ref: '#/components/schemas/Message'}
            - {type: 'null'}
    SafeMutationRequest:
      description: |
        Strict allowlist for replay-safe local mutation delivery. The server
        additionally binds each canonical body to the authenticated device and
        `Idempotency-Key` in the same SQLite transaction as the mutation.
      oneOf:
        - $ref: '#/components/schemas/FeedbackMutationRequest'
        - $ref: '#/components/schemas/MemoryMetadataMutationRequest'
        - $ref: '#/components/schemas/ChatMessageMutationRequest'
    FeedbackMutationRequest:
      type: object
      additionalProperties: false
      required: [operation, payload]
      properties:
        operation: {const: feedback.create}
        resource_id: {type: 'null'}
        payload: {$ref: '#/components/schemas/FeedbackCreate'}
    MemoryMetadataMutationRequest:
      type: object
      additionalProperties: false
      required: [operation, resource_id, payload]
      properties:
        operation: {const: memory.metadata.update}
        resource_id: {type: string, minLength: 1, maxLength: 500}
        payload:
          type: object
          additionalProperties: false
          required: [pinned]
          properties:
            pinned: {type: boolean}
    ChatMessageMutationRequest:
      type: object
      additionalProperties: false
      required: [operation, payload]
      properties:
        operation: {const: chat.message.create}
        resource_id: {type: [string, 'null'], minLength: 1, maxLength: 500}
        payload:
          type: object
          additionalProperties: false
          required: [content]
          properties:
            content: {type: string, minLength: 1, maxLength: 32000}
            conversation_id: {type: [string, 'null']}
            mode: {$ref: '#/components/schemas/TaskMode', default: normal}
            start_task: {const: false, default: false}
    IdempotentMutationReceipt:
      type: object
      additionalProperties: false
      required: [idempotent_replay, result]
      properties:
        idempotent_replay:
          type: boolean
          description: True only when the exact previously stored response was returned.
        result:
          oneOf:
            - {$ref: '#/components/schemas/FeedbackRecord'}
            - {$ref: '#/components/schemas/MemoryItem'}
            - {$ref: '#/components/schemas/ChatResult'}
    Conversation:
      type: object
      required: [id, title, created_at, updated_at]
      properties:
        id: {type: string}
        title: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_message: {type: [string, 'null']}
    Message:
      type: object
      required: [id, conversation_id, role, content, created_at]
      properties:
        id: {type: string}
        conversation_id: {type: string}
        task_id: {type: [string, 'null']}
        role: {type: string, enum: [user, agent, system]}
        agent_id: {type: [string, 'null']}
        content: {type: string}
        metadata:
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: 'null'}
        created_at: {type: string, format: date-time}

    ToolProposal:
      type: object
      additionalProperties: false
      required: [tool_name, arguments, summary]
      properties:
        tool_name:
          type: string
          enum: [workspace.list_dir, workspace.read_text, workspace.write_text, process.run]
        arguments:
          type: object
          additionalProperties: true
        planner_source:
          type: string
          enum: [iphone_local, ubuntu_local, manual, test]
          default: manual
        summary:
          type: string
          minLength: 1
          maxLength: 2000
          description: Untrusted caller context accepted for compatibility and replaced by a fixed server label before any tool call is persisted or exposed.
    PublicReadToolArguments:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: {type: string}
    PublicWriteToolArguments:
      type: object
      additionalProperties: false
      required: [path, content, arguments_redacted]
      properties:
        path: {type: string}
        content:
          type: string
          pattern: '^<redacted: (?:[0-9]+|unknown) UTF-8 bytes>$'
        arguments_redacted: {const: true}
    PublicProcessToolArguments:
      type: object
      additionalProperties: false
      required: [argv, argument_count, arguments_redacted]
      properties:
        argv:
          type: array
          minItems: 0
          maxItems: 1
          prefixItems: [{const: '<redacted>'}]
        argument_count: {type: integer, minimum: 0}
        arguments_redacted: {const: true}
    PublicProcessToolResult:
      type: object
      additionalProperties: false
      required: [output_redacted]
      properties:
        output_redacted: {const: true}
        returncode: {type: integer}
        stdout: {type: string, pattern: '^<redacted: [0-9]+ UTF-8 bytes>$'}
        stderr: {type: string, pattern: '^<redacted: [0-9]+ UTF-8 bytes>$'}
        stdout_truncated: {type: boolean}
        stderr_truncated: {type: boolean}
        sandbox: {const: bubblewrap}
        network: {const: denied}
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, task_id, tool_name, arguments, summary, risk, status, approval_id, result, error, created_at, updated_at]
      allOf:
        - if:
            properties:
              status: {const: completed}
            required: [status]
          then:
            properties:
              result: {type: object}
      oneOf:
        - properties:
            tool_name: {const: workspace.list_dir}
            summary: {const: 'List a workspace directory'}
            arguments: {$ref: '#/components/schemas/PublicReadToolArguments'}
        - properties:
            tool_name: {const: workspace.read_text}
            summary: {const: 'Read a workspace file'}
            arguments: {$ref: '#/components/schemas/PublicReadToolArguments'}
        - properties:
            tool_name: {const: workspace.write_text}
            summary: {const: 'Write text to a workspace file'}
            arguments: {$ref: '#/components/schemas/PublicWriteToolArguments'}
        - properties:
            tool_name: {const: process.run}
            summary: {const: 'Run a sandboxed process'}
            arguments: {$ref: '#/components/schemas/PublicProcessToolArguments'}
            result:
              oneOf:
                - {$ref: '#/components/schemas/PublicProcessToolResult'}
                - {type: 'null'}
            error:
              enum: [null, 'sandboxed process failed; detailed error retained locally']
      properties:
        id: {type: string}
        task_id: {type: string}
        tool_name:
          type: string
          enum: [workspace.list_dir, workspace.read_text, workspace.write_text, process.run]
        arguments:
          type: object
          additionalProperties: true
          description: Public server projection. Sensitive write content and arbitrary process arguments are replaced by redaction metadata; exact values remain internal to binding and execution.
        summary:
          type: string
          description: Fixed server-derived public tool label. Model-authored tool details are omitted so they cannot echo sensitive arguments.
        risk: {type: string, enum: [low, medium, high]}
        status: {type: string, enum: [waiting_permission, queued, running, completed, failed, denied, cancelled]}
        approval_id: {type: [string, 'null']}
        result:
          description: Verified executor evidence, required and non-null when status is completed. Process stdout and stderr are represented only by redacted byte-count markers.
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: 'null'}
        error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ModelProposal:
      type: object
      required: [tool_name, arguments, summary, planner_source]
      properties:
        tool_name: {type: string}
        arguments: {type: object, additionalProperties: true}
        planner_source: {type: string, enum: [iphone_local, ubuntu_local, manual, test]}
        summary:
          type: string
          description: Shown as proposal-only text only when tool_name is none; otherwise replaced by a fixed server label before publication.
    PlanOnlyResult:
      type: object
      required: [task_id, proposal, task]
      properties:
        task_id: {type: string}
        proposal: {$ref: '#/components/schemas/ModelProposal'}
        task: {$ref: '#/components/schemas/TaskRecord'}

    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, expired, cancelled]
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, allow_once, deny]}
        user_note: {type: [string, 'null'], maxLength: 2000}
    Approval:
      type: object
      additionalProperties: false
      description: One-shot consent bound to an exact call, authenticated requester, executable policy snapshot, and durable audit event.
      required: [id, task_id, tool_call_id, action_digest, action, action_preview, binding_valid, requester, policy, affected_data_summary, audit_id, consent_context_valid, summary, risk, status, created_at, expires_at, decided_at, decision]
      allOf:
        - if:
            properties:
              consent_context_valid: {const: true}
            required: [consent_context_valid]
          then:
            properties:
              requester: {type: object}
              policy: {type: object}
              affected_data_summary: {type: string, minLength: 1}
              audit_id: {type: integer, minimum: 1}
        - oneOf:
            - properties:
                action: {const: workspace.list_dir}
                summary: {const: 'List a workspace directory'}
                action_preview:
                  required: [target]
                  not:
                    anyOf:
                      - required: [working_directory]
                      - required: [command]
            - properties:
                action: {const: workspace.read_text}
                summary: {const: 'Read a workspace file'}
                action_preview:
                  required: [target]
                  not:
                    anyOf:
                      - required: [working_directory]
                      - required: [command]
            - properties:
                action: {const: workspace.write_text}
                summary: {const: 'Write text to a workspace file'}
                action_preview:
                  required: [target]
                  properties:
                    arguments_redacted: {const: true}
                  not:
                    anyOf:
                      - required: [working_directory]
                      - required: [command]
            - properties:
                action: {const: process.run}
                summary: {const: 'Run a sandboxed process'}
                action_preview:
                  required: [target, working_directory, command]
      properties:
        id: {type: string}
        task_id: {type: string}
        tool_call_id: {type: string, minLength: 1}
        action_digest:
          type: string
          minLength: 71
          maxLength: 71
          pattern: '^sha256:[0-9a-f]{64}$'
        action:
          type: string
          enum: [workspace.list_dir, workspace.read_text, workspace.write_text, process.run]
        action_preview:
          type: object
          additionalProperties: false
          required: [operation, details, arguments_redacted]
          properties:
            operation: {type: string, minLength: 1}
            target: {type: string, minLength: 1}
            working_directory: {type: string, minLength: 1}
            command:
              type: array
              minItems: 1
              maxItems: 256
              items: {type: string, minLength: 1}
            details:
              type: array
              minItems: 1
              maxItems: 256
              items: {type: string, minLength: 1}
            arguments_redacted: {type: boolean}
        binding_valid: {type: boolean}
        requester:
          description: Authenticated device that initiated the proposal; null only for unverifiable historical records.
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, id, name]
              properties:
                type: {type: string, const: device}
                id: {type: string, minLength: 1}
                name: {type: string, minLength: 1}
            - {type: 'null'}
        policy:
          description: Immutable snapshot of the executable rule that required consent; null only for unverifiable historical records.
          oneOf:
            - type: object
              additionalProperties: false
              required: [rule_id, decision, reason]
              properties:
                rule_id: {type: string, minLength: 1}
                decision: {const: ask}
                reason: {type: string, minLength: 1}
            - {type: 'null'}
        affected_data_summary:
          type: [string, 'null']
          minLength: 1
          description: Server-derived, redacted description of data the bound action may affect.
        audit_id:
          type: [integer, 'null']
          minimum: 1
          description: Monotonic identifier of the durable approval.requested audit event.
        consent_context_valid:
          type: boolean
          description: True only when requester, policy, affected-data snapshot, and audit linkage agree.
        summary:
          type: string
          description: Fixed server-derived public tool label; model-authored tool details are omitted.
        risk: {type: string, enum: [low, medium, high]}
        status: {$ref: '#/components/schemas/ApprovalStatus'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
        decision:
          oneOf:
            - type: object
              additionalProperties: false
              required: [decision, actor_id, user_note]
              properties:
                decision: {type: string, enum: [approve, deny]}
                actor_id: {type: string, minLength: 1}
                user_note: {type: [string, 'null']}
            - {type: 'null'}
    ApprovalToolResult:
      type: object
      required: [approval, tool_call]
      properties:
        approval: {$ref: '#/components/schemas/Approval'}
        tool_call: {$ref: '#/components/schemas/ToolCall'}

    MemoryCreate:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 32000}
        summary: {type: [string, 'null'], maxLength: 2000}
        scope: {type: string, minLength: 1, maxLength: 100, default: general}
        kind: {type: string, minLength: 1, maxLength: 100, default: fact}
        sensitivity: {type: string, minLength: 1, maxLength: 50, default: normal}
        confidence: {type: number, minimum: 0, maximum: 1, default: 1}
        pinned: {type: boolean, default: false}
    MemoryUpdate:
      type: object
      additionalProperties: false
      properties:
        content: {type: [string, 'null'], minLength: 1, maxLength: 32000}
        summary: {type: [string, 'null'], maxLength: 2000}
        pinned: {type: [boolean, 'null']}
    MemorySearch:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 2000}
        scope: {type: [string, 'null'], maxLength: 100}
        kind: {type: [string, 'null'], maxLength: 100}
    MemoryItem:
      type: object
      required: [id, scope, kind, content, summary, sensitivity, confidence, pinned, metadata, created_at, updated_at]
      properties:
        id: {type: string}
        scope: {type: string}
        kind: {type: string}
        content: {type: string}
        summary: {type: [string, 'null']}
        sensitivity: {type: string}
        confidence: {type: number}
        pinned: {type: boolean}
        metadata:
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MemorySearchResult:
      allOf:
        - $ref: '#/components/schemas/MemoryItem'
        - type: object
          required: [score, search_kind]
          properties:
            score: {type: number, minimum: 0, maximum: 1}
            search_kind: {type: string, enum: [lexical, vector, hybrid]}

    AgentSkill:
      type: string
      enum:
        - workspace.list_dir
        - workspace.read_text
        - research.query
        - code_review.git_status
        - code_review.git_diff
        - code_review.git_show
        - code_review.static_analysis
    AgentCapabilities:
      type: object
      additionalProperties: false
      description: |
        Bounded metadata accepted by server policy. A registration may include
        only keys applicable to its single declared worker family.
      properties:
        max_concurrency: {type: integer, minimum: 1, maximum: 32}
        memory_mb: {type: integer, minimum: 1, maximum: 4194304}
        max_results: {type: integer, minimum: 1, maximum: 10}
        max_query_characters: {type: integer, minimum: 1, maximum: 2000}
        max_result_bytes: {type: integer, minimum: 1, maximum: 524288}
        max_operation_seconds: {type: integer, minimum: 1, maximum: 120}
        max_paths: {type: integer, minimum: 1, maximum: 50}
        max_selected_files: {type: integer, minimum: 1, maximum: 100}
    AgentCreate:
      type: object
      additionalProperties: false
      required: [name, endpoint]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        version:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^\d{1,4}\.\d{1,4}\.\d{1,4}$'
          default: 0.1.0
        endpoint:
          type: string
          format: uri
          minLength: 1
          maxLength: 2083
          pattern: '^[Hh][Tt][Tt][Pp][Ss]?://'
          description: HTTP(S) registration metadata without credentials, query, or fragment.
        model_id: {type: [string, 'null'], maxLength: 500}
        skills:
          type: array
          maxItems: 7
          uniqueItems: true
          items: {$ref: '#/components/schemas/AgentSkill'}
          description: Empty is inert; non-empty skills must belong to one server-approved worker family.
          default: []
        max_concurrency: {type: integer, minimum: 1, maximum: 32, default: 1}
        capacity: {$ref: '#/components/schemas/AgentCapabilities', default: {}}
        runtime: {type: string, const: python, default: python}
        supported_protocol_version:
          type: string
          const: mongars-worker-v0.9
          default: mongars-worker-v0.9
          description: Worker protocol v0.9 remains the compatible protocol carried by API v0.11.
    AgentCard:
      type: object
      additionalProperties: false
      required: [agent_id, name, version, skills, model_id, runtime, max_concurrency, supported_protocol_version, capabilities]
      properties:
        agent_id: {type: string}
        name: {type: string}
        version: {type: string}
        skills:
          type: array
          maxItems: 7
          uniqueItems: true
          items: {$ref: '#/components/schemas/AgentSkill'}
        model_id: {type: [string, 'null']}
        runtime: {type: string, const: python}
        max_concurrency: {type: integer, minimum: 1, maximum: 32}
        supported_protocol_version: {type: string, const: mongars-worker-v0.9}
        capabilities: {$ref: '#/components/schemas/AgentCapabilities'}
    AgentHeartbeat:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [online, offline, busy, draining], default: online}
    Agent:
      type: object
      required: [id, name, version, endpoint, model_id, status, skills, last_heartbeat_at, last_seen_at, max_concurrency, capacity, runtime, supported_protocol_version, agent_card, created_at, updated_at, active_jobs, historical_score]
      properties:
        id: {type: string}
        name: {type: string}
        version: {type: string}
        endpoint: {type: string}
        model_id: {type: [string, 'null']}
        status: {type: string, enum: [online, offline, busy, draining, unverified]}
        skills:
          type: array
          maxItems: 7
          uniqueItems: true
          items: {$ref: '#/components/schemas/AgentSkill'}
        last_heartbeat_at: {type: [string, 'null'], format: date-time}
        last_seen_at: {type: [string, 'null'], format: date-time}
        max_concurrency: {type: integer, minimum: 1, maximum: 32}
        capacity: {$ref: '#/components/schemas/AgentCapabilities'}
        runtime: {type: string, const: python}
        supported_protocol_version: {type: string, const: mongars-worker-v0.9}
        agent_card: {$ref: '#/components/schemas/AgentCard'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        active_jobs: {type: integer, minimum: 0}
        historical_score: {type: number}
    AgentRegistration:
      allOf:
        - $ref: '#/components/schemas/Agent'
        - type: object
          required: [credential]
          properties:
            credential: {type: string, readOnly: true}
    AgentJobDispatch:
      type: object
      additionalProperties: false
      required: [required_skill, payload]
      properties:
        required_skill:
          $ref: '#/components/schemas/AgentSkill'
        payload: {type: object, additionalProperties: true}
    AgentJobClaim:
      type: object
      additionalProperties: false
      properties:
        wait_seconds: {type: integer, minimum: 0, maximum: 30, default: 0}
    AgentJobHeartbeat:
      type: object
      additionalProperties: false
      required: [claim_token, lease_id, lease_generation]
      properties:
        claim_token: {type: string, minLength: 20, maxLength: 500, writeOnly: true}
        lease_id: {type: string, minLength: 10, maxLength: 200}
        lease_generation: {type: integer, minimum: 1}
    AgentJobResult:
      type: object
      additionalProperties: false
      required: [claim_token, lease_id, lease_generation, status]
      properties:
        claim_token: {type: string, minLength: 20, maxLength: 500, writeOnly: true}
        lease_id: {type: string, minLength: 10, maxLength: 200}
        lease_generation: {type: integer, minimum: 1}
        status: {type: string, enum: [completed, failed]}
        result: {type: [object, 'null'], additionalProperties: true}
        error: {type: [string, 'null'], maxLength: 4000}
    AgentJob:
      type: object
      additionalProperties: false
      required: [id, task_id, required_skill, payload, status, claimed_by, result, error, created_at, updated_at, claimed_at, heartbeat_at, completed_at, lease_id, lease_expires_at, lease_generation, attempt_count, max_attempts, last_agent_id, last_failure_reason]
      properties:
        id: {type: string}
        task_id: {type: string}
        required_skill: {$ref: '#/components/schemas/AgentSkill'}
        payload: {type: object, additionalProperties: true}
        status: {type: string, enum: [queued, claimed, running, completed, failed, cancelled, quarantined]}
        claimed_by: {type: [string, 'null']}
        result: {type: [object, 'null'], additionalProperties: true}
        error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        claimed_at: {type: [string, 'null'], format: date-time}
        heartbeat_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        lease_id: {type: [string, 'null']}
        lease_expires_at: {type: [string, 'null'], format: date-time}
        lease_generation: {type: integer, minimum: 0}
        attempt_count: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        last_agent_id: {type: [string, 'null']}
        last_failure_reason: {type: [string, 'null']}
    ClaimedAgentJob:
      type: object
      additionalProperties: false
      required: [id, task_id, required_skill, payload, status, claimed_by, result, error, created_at, updated_at, claimed_at, heartbeat_at, completed_at, lease_id, lease_expires_at, lease_generation, attempt_count, max_attempts, last_agent_id, last_failure_reason, claim_token]
      properties:
        id: {type: string}
        task_id: {type: string}
        required_skill: {$ref: '#/components/schemas/AgentSkill'}
        payload: {type: object, additionalProperties: true}
        status: {const: claimed}
        claimed_by: {type: string}
        result: {type: 'null'}
        error: {type: 'null'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        claimed_at: {type: string, format: date-time}
        heartbeat_at: {type: string, format: date-time}
        completed_at: {type: 'null'}
        lease_id: {type: string, minLength: 10, maxLength: 200}
        lease_expires_at: {type: string, format: date-time}
        lease_generation: {type: integer, minimum: 1}
        attempt_count: {type: integer, minimum: 1}
        max_attempts: {type: integer, minimum: 1}
        last_agent_id: {type: string}
        last_failure_reason: {type: 'null'}
        claim_token: {type: string, minLength: 20, maxLength: 500, readOnly: true}
    AgentJobResultRecord:
      type: object
      additionalProperties: false
      required: [id, task_id, required_skill, payload, status, claimed_by, result, error, created_at, updated_at, claimed_at, heartbeat_at, completed_at, lease_id, lease_expires_at, lease_generation, attempt_count, max_attempts, last_agent_id, last_failure_reason, idempotent_replay]
      properties:
        id: {type: string}
        task_id: {type: string}
        required_skill: {$ref: '#/components/schemas/AgentSkill'}
        payload: {type: object, additionalProperties: true}
        status: {type: string, enum: [completed, failed]}
        claimed_by: {type: string}
        result: {type: [object, 'null'], additionalProperties: true}
        error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        claimed_at: {type: string, format: date-time}
        heartbeat_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        lease_id: {type: string, minLength: 10, maxLength: 200}
        lease_expires_at: {type: string, format: date-time}
        lease_generation: {type: integer, minimum: 1}
        attempt_count: {type: integer, minimum: 1}
        max_attempts: {type: integer, minimum: 1}
        last_agent_id: {type: string}
        last_failure_reason: {type: 'null'}
        idempotent_replay: {type: boolean}
      oneOf:
        - properties:
            status: {const: completed}
            error: {type: 'null'}
        - properties:
            status: {const: failed}
            error: {const: remote worker reported failure}

    IPhoneCapabilityName:
      type: string
      enum:
        - iphone.location.current
        - iphone.contacts.lookup
        - iphone.calendar.events
        - iphone.photos.pick
        - iphone.mail.compose
        - iphone.sms.compose
    IPhoneCapabilityStatus:
      type: string
      enum: [waiting_approval, approved, consumed, completed, denied, failed, cancelled, expired]
    AgentCapabilityRequest:
      type: object
      additionalProperties: false
      required: [claim_token, lease_id, lease_generation, capability_name, arguments]
      properties:
        claim_token: {type: string, minLength: 20, maxLength: 500, writeOnly: true}
        lease_id: {type: string, minLength: 10, maxLength: 200}
        lease_generation: {type: integer, minimum: 1}
        capability_name: {$ref: '#/components/schemas/IPhoneCapabilityName'}
        arguments: {type: object}
      oneOf:
        - properties:
            capability_name: {const: iphone.location.current}
            arguments: {$ref: '#/components/schemas/IPhoneEmptyArguments'}
        - properties:
            capability_name: {const: iphone.contacts.lookup}
            arguments: {$ref: '#/components/schemas/IPhoneContactsLookupArguments'}
        - properties:
            capability_name: {const: iphone.calendar.events}
            arguments: {$ref: '#/components/schemas/IPhoneCalendarEventsArguments'}
        - properties:
            capability_name: {const: iphone.photos.pick}
            arguments: {$ref: '#/components/schemas/IPhoneEmptyArguments'}
        - properties:
            capability_name: {const: iphone.mail.compose}
            arguments: {$ref: '#/components/schemas/IPhoneMailComposeArguments'}
        - properties:
            capability_name: {const: iphone.sms.compose}
            arguments: {$ref: '#/components/schemas/IPhoneSMSComposeArguments'}
    AgentCapabilityPoll:
      type: object
      additionalProperties: false
      required: [claim_token, lease_id, lease_generation]
      properties:
        claim_token: {type: string, minLength: 20, maxLength: 500, writeOnly: true}
        lease_id: {type: string, minLength: 10, maxLength: 200}
        lease_generation: {type: integer, minimum: 1}
    AgentCapabilityPollResult:
      type: object
      additionalProperties: false
      required: [request_id, capability_name, status, result, created_at, expires_at, completed_at]
      properties:
        request_id: {type: string}
        capability_name: {$ref: '#/components/schemas/IPhoneCapabilityName'}
        status: {$ref: '#/components/schemas/IPhoneCapabilityStatus'}
        result:
          oneOf:
            - {$ref: '#/components/schemas/IPhoneCapabilityNativeResult'}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
    IPhoneCapabilityRequestPreview:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, task_id, agent_id, target_device_id, capability, status, created_at, expires_at]
      properties:
        schema_version: {const: '0.9', description: Stable capability-envelope schema identifier retained by API release 0.11.0.}
        request_id: {type: string}
        task_id: {type: string}
        agent_id: {type: string}
        target_device_id: {type: string}
        capability: {$ref: '#/components/schemas/IPhoneCapabilityName'}
        status: {$ref: '#/components/schemas/IPhoneCapabilityStatus'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    IPhoneCapabilityRequestDetail:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, task_id, agent_id, target_device_id, capability, status, created_at, expires_at, arguments, action_digest, grant]
      properties:
        schema_version: {const: '0.9', description: Stable capability-envelope schema identifier retained by API release 0.11.0.}
        request_id: {type: string}
        task_id: {type: string}
        agent_id: {type: string}
        target_device_id: {type: string}
        capability: {$ref: '#/components/schemas/IPhoneCapabilityName'}
        status: {$ref: '#/components/schemas/IPhoneCapabilityStatus'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        arguments:
          type: object
          description: Validated arguments for the named capability; never included in WebSocket, audit, or board payloads.
        action_digest: {$ref: '#/components/schemas/ActionDigest'}
        grant:
          oneOf:
            - {$ref: '#/components/schemas/IPhoneCapabilityGrant'}
            - {type: 'null'}
      oneOf:
        - properties:
            capability: {const: iphone.location.current}
            arguments: {$ref: '#/components/schemas/IPhoneEmptyArguments'}
        - properties:
            capability: {const: iphone.contacts.lookup}
            arguments: {$ref: '#/components/schemas/IPhoneContactsLookupArguments'}
        - properties:
            capability: {const: iphone.calendar.events}
            arguments: {$ref: '#/components/schemas/IPhoneCalendarEventsArguments'}
        - properties:
            capability: {const: iphone.photos.pick}
            arguments: {$ref: '#/components/schemas/IPhoneEmptyArguments'}
        - properties:
            capability: {const: iphone.mail.compose}
            arguments: {$ref: '#/components/schemas/IPhoneMailComposeArguments'}
        - properties:
            capability: {const: iphone.sms.compose}
            arguments: {$ref: '#/components/schemas/IPhoneSMSComposeArguments'}
    IPhoneCapabilityGrant:
      type: object
      additionalProperties: false
      required: [schema_version, grant_id, request_id, task_id, agent_id, target_device_id, approval_id, audit_id, capability, action_digest, issued_at, expires_at, use]
      properties:
        schema_version: {const: '0.9', description: Stable capability-envelope schema identifier retained by API release 0.11.0.}
        grant_id: {type: string, minLength: 32, maxLength: 500, readOnly: true}
        request_id: {type: string}
        task_id: {type: string}
        agent_id: {type: string}
        target_device_id: {type: string}
        approval_id: {type: string}
        audit_id: {type: integer, minimum: 1}
        capability: {$ref: '#/components/schemas/IPhoneCapabilityName'}
        action_digest: {$ref: '#/components/schemas/ActionDigest'}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        use: {const: once}
    ActionDigest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    IPhoneEmptyArguments:
      type: object
      additionalProperties: false
    IPhoneContactsLookupArguments:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 200}
    IPhoneCalendarEventsArguments:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time, description: Must be later than `start`.}
    IPhoneMailComposeArguments:
      type: object
      additionalProperties: false
      properties:
        recipients: {type: array, maxItems: 20, items: {type: string, maxLength: 1000}, default: []}
        subject: {type: [string, 'null'], maxLength: 500}
        body: {type: [string, 'null'], maxLength: 10000}
    IPhoneSMSComposeArguments:
      type: object
      additionalProperties: false
      properties:
        recipients: {type: array, maxItems: 20, items: {type: string, maxLength: 1000}, default: []}
        message: {type: [string, 'null'], maxLength: 2000}
    IPhoneCapabilityDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [approve, deny]}
        user_note: {type: [string, 'null'], maxLength: 2000}
    IPhoneCapabilityExecute:
      type: object
      additionalProperties: false
      required: [grant_id, action_digest]
      properties:
        grant_id: {type: string, minLength: 32, maxLength: 500, writeOnly: true}
        action_digest: {$ref: '#/components/schemas/ActionDigest'}
    IPhoneCapabilityConsumeReceipt:
      type: object
      additionalProperties: false
      required: [status, request_id, grant_id, action_digest, consumed_at]
      properties:
        status: {const: consumed}
        request_id: {type: string}
        grant_id: {type: string}
        action_digest: {$ref: '#/components/schemas/ActionDigest'}
        consumed_at: {type: string, format: date-time}
    IPhoneCapabilityResultSubmit:
      type: object
      additionalProperties: false
      required: [grant_id, action_digest, result]
      properties:
        grant_id: {type: string, minLength: 32, maxLength: 500, writeOnly: true}
        action_digest: {$ref: '#/components/schemas/ActionDigest'}
        result: {$ref: '#/components/schemas/IPhoneCapabilityNativeResult'}
    IPhoneCapabilityResultReceipt:
      type: object
      additionalProperties: false
      required: [status, request_id, grant_id]
      properties:
        status: {type: string, enum: [accepted, duplicate]}
        request_id: {type: string}
        grant_id: {type: string}
    IPhoneCapabilityNativeResult:
      type: object
      additionalProperties: false
      description: Strict native result stored server-side; its value is redacted from audit, board and WebSocket events.
      required: [name, status]
      properties:
        name: {$ref: '#/components/schemas/IPhoneCapabilityName'}
        status: {type: string, enum: [completed, cancelled, denied, failed]}
        value: {}
        reason: {type: string, enum: [permission_denied, unavailable, native_error]}
      oneOf:
        - required: [value]
          not: {required: [reason]}
          properties:
            name: {const: iphone.location.current}
            status: {const: completed}
            value: {$ref: '#/components/schemas/IPhoneLocationValue'}
        - required: [value]
          not: {required: [reason]}
          properties:
            name: {const: iphone.contacts.lookup}
            status: {const: completed}
            value:
              type: array
              maxItems: 25
              items: {$ref: '#/components/schemas/IPhoneContactValue'}
        - required: [value]
          not: {required: [reason]}
          properties:
            name: {const: iphone.calendar.events}
            status: {const: completed}
            value:
              type: array
              maxItems: 100
              items: {$ref: '#/components/schemas/IPhoneCalendarEventValue'}
        - required: [value]
          not: {required: [reason]}
          properties:
            name: {const: iphone.photos.pick}
            status: {const: completed}
            value: {$ref: '#/components/schemas/IPhonePhotoValue'}
        - required: [value]
          not: {required: [reason]}
          properties:
            name: {type: string, enum: [iphone.mail.compose, iphone.sms.compose]}
            status: {const: completed}
            value: {$ref: '#/components/schemas/IPhoneComposerValue'}
        - required: [value]
          not: {required: [reason]}
          properties:
            name: {type: string, enum: [iphone.photos.pick, iphone.mail.compose, iphone.sms.compose]}
            status: {const: cancelled}
            value: {type: 'null'}
        - required: [value, reason]
          properties:
            status: {const: denied}
            value: {type: 'null'}
            reason: {type: string, enum: [permission_denied, unavailable]}
        - required: [value, reason]
          properties:
            status: {const: failed}
            value: {type: 'null'}
            reason: {const: native_error}
    IPhoneLocationValue:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracy]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        accuracy: {type: [number, 'null']}
    IPhoneContactValue:
      type: object
      additionalProperties: false
      required: [id, name, phoneNumbers, emails]
      properties:
        id: {type: string, minLength: 1, maxLength: 500, pattern: '^\S(?:[\s\S]*\S)?$'}
        name: {type: string, maxLength: 1000}
        phoneNumbers: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 1000, pattern: '^\S(?:[\s\S]*\S)?$'}}
        emails: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 1000, pattern: '^\S(?:[\s\S]*\S)?$'}}
    IPhoneCalendarEventValue:
      type: object
      additionalProperties: false
      required: [id, title, start, end]
      properties:
        id: {type: string, minLength: 1, maxLength: 500, pattern: '^\S(?:[\s\S]*\S)?$'}
        title: {type: string, maxLength: 2000}
        start: {type: string, format: date-time, maxLength: 64}
        end: {type: string, format: date-time, maxLength: 64}
    IPhonePhotoValue:
      type: object
      additionalProperties: false
      required: [uri, width, height]
      properties:
        uri: {type: string, minLength: 1, maxLength: 8000, pattern: '^\S(?:[\s\S]*\S)?$'}
        width: {type: number, exclusiveMinimum: 0}
        height: {type: number, exclusiveMinimum: 0}
    IPhoneComposerValue:
      type: object
      additionalProperties: false
      required: [composed]
      properties:
        composed: {const: true}

    AuditEvent:
      type: object
      description: |
        Public audit projection. Hashes cover the immutable internal serialized
        payload; legacy process-error redaction can therefore make the returned
        payload differ from the material covered by `hash`.
      required: [id, trace_id, event_type, actor_type, actor_id, payload, hash, created_at]
      properties:
        id: {type: integer}
        trace_id:
          type: [string, 'null']
          description: Null only on read-compatible audit rows created before trace metadata existed.
        event_type: {type: string}
        actor_type:
          type: [string, 'null']
          description: Null only on read-compatible audit rows created before actor metadata existed.
        actor_id:
          type: [string, 'null']
          description: Null only on read-compatible audit rows created before actor metadata existed.
        task_id: {type: [string, 'null']}
        payload:
          type: object
          additionalProperties: true
          description: Public payload; legacy process failure text may be redacted.
        prev_hash: {type: [string, 'null']}
        hash:
          type: [string, 'null']
          description: SHA-256 hash of immutable internal event material before public projection; null only for legacy unchained rows.
        created_at: {type: string, format: date-time}
    FeedbackCreate:
      type: object
      additionalProperties: false
      properties:
        task_id: {type: [string, 'null']}
        agent_id: {type: [string, 'null']}
        type: {type: string, minLength: 1, maxLength: 100, default: rating}
        label: {type: [string, 'null'], maxLength: 200}
        score: {type: [number, 'null'], minimum: 0, maximum: 5}
        notes: {type: [string, 'null'], maxLength: 4000}
    FeedbackCorrection:
      type: object
      additionalProperties: false
      required: [task_id, corrected_behavior]
      properties:
        task_id: {type: string, minLength: 1, maxLength: 200}
        corrected_behavior: {type: string, minLength: 1, maxLength: 32000}
        notes: {type: [string, 'null'], maxLength: 4000}
    DatasetExport:
      type: object
      additionalProperties: false
      required: [format, data]
      properties:
        format: {const: jsonl}
        data: {type: string}
    FeedbackRecord:
      type: object
      additionalProperties: false
      required: [id, task_id, agent_id, type, label, score, notes, payload, created_at]
      properties:
        id: {type: string}
        task_id: {type: [string, 'null']}
        agent_id: {type: [string, 'null']}
        type: {type: string, minLength: 1, maxLength: 100}
        label: {type: [string, 'null'], maxLength: 200}
        score: {type: [number, 'null'], minimum: 0, maximum: 5}
        notes: {type: [string, 'null'], maxLength: 4000}
        payload: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}

    Bootstrap:
      type: object
      required: [server_time, tasks, approvals, tool_calls, conversations, messages, agents, pinned_memory, counts, cursor]
      properties:
        server_time: {type: string, format: date-time}
        tasks: {type: array, items: {$ref: '#/components/schemas/TaskRecord'}}
        approvals: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        tool_calls: {type: array, items: {$ref: '#/components/schemas/ToolCall'}}
        conversations: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        messages: {type: array, items: {$ref: '#/components/schemas/Message'}}
        agents: {type: array, items: {$ref: '#/components/schemas/Agent'}}
        pinned_memory: {type: array, items: {$ref: '#/components/schemas/MemoryItem'}}
        counts:
          type: object
          required: [tasks, messages, agents, memory_items, audit_events, approvals_pending]
          properties:
            tasks: {type: integer}
            messages: {type: integer}
            agents: {type: integer}
            memory_items: {type: integer}
            audit_events: {type: integer}
            approvals_pending: {type: integer}
        cursor: {type: string}
    WebSocketTicket:
      type: object
      required: [ticket, expires_in_seconds]
      properties:
        ticket: {type: string, writeOnly: true}
        expires_in_seconds: {const: 30}

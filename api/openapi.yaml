            const: iphone.calendar.events
          arguments:
            $ref: '#/components/schemas/IPhoneCalendarEventsArguments'
      - properties:
          capability_name:
            const: iphone.photos.pick
          arguments:
            $ref: '#/components/schemas/IPhoneEmptyArguments'
      - properties:
          capability_name:
            const: iphone.mail.compose
          arguments:
            $ref: '#/components/schemas/IPhoneMailComposeArguments'
      - properties:
          capability_name:
            const: iphone.sms.compose
          arguments:
            $ref: '#/components/schemas/IPhoneSMSComposeArguments'
      - properties:
          capability_name:
            const: iphone.calendar.calendars
          arguments:
            $ref: '#/components/schemas/_EmptyCapabilityArguments'
      - properties:
          capability_name:
            const: iphone.calendar.event.create
          arguments:
            $ref: '#/components/schemas/_CalendarEventCreateArguments'
      - properties:
          capability_name:
            const: iphone.calendar.event.update
          arguments:
            $ref: '#/components/schemas/_CalendarEventUpdateArguments'
      - properties:
          capability_name:
            const: iphone.calendar.reminder.create
          arguments:
            $ref: '#/components/schemas/_ReminderCreateArguments'
      - properties:
          capability_name:
            const: iphone.calendar.reminder.update
          arguments:
            $ref: '#/components/schemas/_ReminderUpdateArguments'
      - properties:
          capability_name:
            const: iphone.calendar.reminders
          arguments:
            $ref: '#/components/schemas/_CalendarRemindersArguments'
    AgentCapabilityPoll:

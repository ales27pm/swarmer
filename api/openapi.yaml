        schema_version: {const: '0.9', description: Stable capability-envelope schema identifier retained by API release 0.14.2.}
        request_id: {type: string}
        task_id: {type: string}
        agent_id: {type: string}
        target_device_id: {type: string}
        capability: {$ref: '#/components/schemas/IPhoneCapabilityName'}
        status: {$ref: '#/components/schemas/IPhoneCapabilityStatus'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    IPhoneCapabilityRequestDetail:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - request_id
      - task_id
      - agent_id
      - target_device_id
      - capability
      - status
      - created_at
      - expires_at
      - arguments
      - action_digest
      - grant
      properties:
        schema_version:

version: 1
mode: strict_actions
principle: "models_propose_gateway_decides_executors_act"

default_decision: ask

action_classes:
  read_safe:
    default: allow
  write_project:
    default: ask
  execute_safe:
    default: ask
  network_read:
    default: ask
  network_write:
    default: ask
  device_sensitive:
    default: ask
  destructive:
    default: deny
  credential:
    default: deny

# Authoritative executable decisions for the currently supported tool surface.
# The broader action rules below document matching policy for future adapters.
tool_rules:
  workspace.list_dir:
    id: allow-workspace-list
    description: Listing a validated non-protected workspace directory is read-only.
    decision: allow
    risk: low
  workspace.read_text:
    id: allow-workspace-read
    description: Reading a validated non-protected workspace file is read-only.
    decision: allow
    risk: low
  workspace.write_text:
    id: ask-workspace-write
    description: Writing workspace file content requires explicit one-use approval.
    decision: ask
    risk: medium
    approval_ttl_seconds: 300
  process.run:
    id: ask-sandboxed-process
    description: Running a sandboxed process can modify workspace files and requires explicit one-use approval.
    decision: ask
    risk: high
    approval_ttl_seconds: 300

# Native capabilities are a separate policy surface. Every current capability
# requires an explicit, short-lived, one-use grant from its paired iPhone.
capability_rules:
  iphone.location.current:
    id: ask-iphone-location-current
    description: Reading the iPhone's current location requires explicit device approval.
    decision: ask
    risk: high
    approval_ttl_seconds: 180
  iphone.contacts.lookup:
    id: ask-iphone-contacts-lookup
    description: Looking up iPhone contacts requires explicit device approval.
    decision: ask
    risk: high
    approval_ttl_seconds: 180
  iphone.calendar.events:
    id: ask-iphone-calendar-events
    description: Reading iPhone calendar events requires explicit device approval.
    decision: ask
    risk: high
    approval_ttl_seconds: 180
  iphone.photos.pick:
    id: ask-iphone-photos-pick
    description: Opening the iOS photo picker requires explicit device approval.
    decision: ask
    risk: medium
    approval_ttl_seconds: 180
  iphone.mail.compose:
    id: ask-iphone-mail-compose
    description: Opening a prefilled iOS mail composer requires explicit device approval.
    decision: ask
    risk: high
    approval_ttl_seconds: 180
  iphone.sms.compose:
    id: ask-iphone-sms-compose
    description: Opening a prefilled iOS SMS composer requires explicit device approval.
    decision: ask
    risk: high
    approval_ttl_seconds: 180

# Remote agent cards are validated separately; these rules are the Gateway's
# executable allowlist for dispatch. Only the two original workspace reads are
# safe for automatic lease redistribution.
worker_skill_rules:
  workspace.list_dir:
    id: allow-worker-workspace-list
    description: A policy-bound worker may list validated non-protected workspace paths.
    decision: allow
    risk: low
    auto_redistribute: true
  workspace.read_text:
    id: allow-worker-workspace-read
    description: A policy-bound worker may read one validated non-protected workspace file.
    decision: allow
    risk: low
    auto_redistribute: true
  research.query:
    id: allow-worker-bounded-research
    description: A research worker may submit a bounded query only through its configured adapter.
    decision: allow
    risk: low
    auto_redistribute: false
  code_review.git_status:
    id: allow-worker-git-status
    description: A review worker may inspect repository status without writes.
    decision: allow
    risk: low
    auto_redistribute: false
  code_review.git_diff:
    id: allow-worker-git-diff
    description: A review worker may inspect bounded diffs without writes.
    decision: allow
    risk: low
    auto_redistribute: false
  code_review.git_show:
    id: allow-worker-git-show
    description: A review worker may inspect HEAD or a full immutable object ID.
    decision: allow
    risk: low
    auto_redistribute: false
  code_review.static_analysis:
    id: allow-worker-static-analysis
    description: A review worker may run its fixed read-only static-analysis routine.
    decision: allow
    risk: low
    auto_redistribute: false

protected_paths:
  - "**/.env"
  - "**/.env.*"
  - "**/*secret*"
  - "**/*token*"
  - "**/*.pem"
  - "**/*.key"
  - "**/id_rsa"
  - "**/id_ed25519"
  - "**/.git/config"
  - "**/.git-credentials"
  - "**/.npmrc"
  - "**/.pypirc"

execution:
  backend: bubblewrap
  binary: /usr/bin/bwrap
  limiter_binary: /usr/bin/prlimit
  network: deny
  max_timeout_seconds: 30
  max_output_bytes: 65536
  max_memory_bytes: 1073741824
  max_processes: 64
  max_file_bytes: 16777216
  max_open_files: 256
  allowed_commands:
    - git
    - mypy
    - node
    - npm
    - npx
    - python3
    - pytest
    - ruff

allowed_project_roots:
  - /home/ales27pm/projects
  - /home/ales27pm/27pm
  - /home/ales27pm/mongars

rules:
  - id: allow-read-project-files
    description: Allow reading files under approved project roots unless protected.
    match:
      action: file.read
      path_prefix_any: ${allowed_project_roots}
    decision: allow

  - id: deny-protected-paths
    description: Never expose secrets to model/tool output.
    match:
      path_glob_any: ${protected_paths}
    decision: deny

  - id: ask-workspace-write
    description: Writing workspace file content requires explicit one-use approval.
    match:
      action_any: [file.write, file.patch, file.delete]
      path_prefix_any: ${allowed_project_roots}
    decision: ask
    approval:
      ttl_seconds: 300
      require_diff: true

  - id: deny-dangerous-shell
    description: Block destructive shell commands by default.
    match:
      action: shell.run
      command_regex: "(rm -rf /|mkfs|dd if=|shutdown|reboot|chmod -R 777|chown -R)"
    decision: deny

  - id: ask-sandboxed-process
    description: Running a sandboxed process can modify workspace files and requires explicit one-use approval.
    match:
      action: shell.run
    decision: ask

  - id: ask-network-write
    match:
      action_any: [email.send, github.push, http.post_external]
    decision: ask

  - id: ask-iphone-sensitive
    match:
      action_prefix: iphone.
    decision: ask

refusal_normalizer:
  enabled: true
  output_type: permission_request
  never_execute_without_gateway: true

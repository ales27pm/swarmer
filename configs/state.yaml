version: 1
source_of_truth: ubuntu

server_db:
  driver: sqlite
  url: sqlite+aiosqlite:///./data/mongars.db
  wal: true
  migrate_to_postgres_when:
    - more_than_one_writer_service
    - more_than_100k_events
    - remote_workers_need_low_latency_state

iphone_replica:
  driver: sqlite
  status: bootstrap_write_through_cache
  tables:
    - tasks
    - approvals
    - sync_meta
  ui_source: authenticated_rest_responses
  local_read_helpers:
    - approvals
  offline_outbox: false

sync:
  bootstrap_endpoint: /sync/bootstrap
  refresh: explicit_rest
  server_websocket_endpoint: /ws
  mobile_websocket_subscription: false

roadmap_sync:
  pull_endpoint: /sync/pull
  push_endpoint: /sync/push
  offline_outbox: true
  mobile_websocket_subscription: true
  conflict_policy:
    server_wins:
      - task.status
      - approval.status
      - audit_events
      - agent.status
    client_wins:
      - ui.preferences
      - draft.messages
    merge:
      - messages
      - feedback_events
      - memory_corrections
